# Winget manifest for 4DA
# Submit to: https://github.com/microsoft/winget-pkgs
#
# After first GitHub release with NSIS installer:
# 1. Get the .exe URL from GitHub releases
# 2. Calculate sha256: certutil -hashfile 4DA-Home_1.0.0_x64-setup.exe SHA256
# 3. Update InstallerUrl and InstallerSha256 below
# 4. Use wingetcreate to generate and submit PR:
#    wingetcreate new --urls https://github.com/4DA-Systems/4DA/releases/download/v1.0.0/4DA-Home_1.0.0_x64-setup.exe
#
# Users install with: winget install 4DA.4DAHome

PackageIdentifier: 4DA.4DA
PackageVersion: 1.0.0
PackageName: 4DA
Publisher: 4DA Systems Pty Ltd
PublisherUrl: https://4da.ai
PublisherSupportUrl: https://github.com/4DA-Systems/4DA/issues
PrivacyUrl: https://4da.ai/privacy
Author: 4DA Systems Pty Ltd
PackageUrl: https://4da.ai
License: FSL-1.1-Apache-2.0
LicenseUrl: https://github.com/4DA-Systems/4DA/blob/main/LICENSE
Copyright: Copyright (c) 2025-2026 4DA Systems Pty Ltd
ShortDescription: 4DA knows every dependency on your machine and tells you — and your coding agent — what changed and exactly what to run. Privately, locally.
Description: >-
  4DA knows every dependency on your machine and tells you — and your coding
  agent — what changed and exactly what to run. Privately, locally. It reads
  npm, pnpm, Yarn, Bun, Cargo, Python and Go lockfiles today, with early support for
  Ruby and PHP, checks the exact installed versions against OSV advisories and
  registry releases, and names the fix. Zero telemetry. No account and no 4DA
  server — runs on your machine. BYOK for cloud AI (a cloud model sees only
  what you send it) or use Ollama for fully offline operation. Every
  version-confirmed vulnerability finding and its fix is free.
Tags:
  - developer-tools
  - productivity
  - privacy
  - content-curation
  - rust
  - tauri
  - intelligence
  - local-first
Moniker: 4da
Installers:
  - Architecture: x64
    InstallerType: nsis
    InstallerUrl: https://github.com/4DA-Systems/4DA/releases/download/v1.0.0/4DA-Home_1.0.0_x64-setup.exe
    InstallerSha256: REPLACE_WITH_SHA256
    InstallerSwitches:
      Silent: /S
      SilentWithProgress: /S
ManifestType: singleton
ManifestVersion: 1.6.0
