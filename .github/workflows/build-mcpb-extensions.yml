name: Build MCP Desktop Extensions (.mcpb)

# Claude Desktop runs on macOS + Windows; better-sqlite3 ships per-platform
# prebuilds, so each OS/arch gets its own bundle (built on that runner).
# Triggered by the same mcp-v* tags as the npm publish, or manually.
on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing mcp-v* tag to attach bundles to (builds from the dispatched ref — ensure it matches the tag's content)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.label }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: win32-x64
          - os: macos-latest
            label: darwin-arm64
          - os: macos-15-intel
            label: darwin-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp-4da-server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.15.0 # match packageManager; unpinned drifts to pnpm 10 and mismatches the pnpm-9 lockfile

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm test

      - name: Build .mcpb bundle
        run: node scripts/build-mcpb.mjs

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: mcpb-${{ matrix.label }}
          path: mcp-4da-server/dist-mcpb/*.mcpb
          if-no-files-found: error

  release:
    name: Attach bundles to release
    if: startsWith(github.ref, 'refs/tags/mcp-v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: bundles
          merge-multiple: true

      - name: Create or update release with bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "@4da/mcp-server ${TAG#mcp-v}" \
              --notes "MCP server release. Desktop extension bundles (.mcpb) attached — one per platform (Claude Desktop: Settings → Extensions → install from file). Also on npm: https://www.npmjs.com/package/@4da/mcp-server"
          gh release upload "$TAG" bundles/*.mcpb --repo "$GITHUB_REPOSITORY" --clobber
