# CodeQL — code scanning that can GATE the merge queue.
#
# Replaces CodeQL "default setup" (enabled 2026-09-24). Default setup analyses
# push and pull_request only. It never posts a result on the temporary commit a
# merge queue builds, so a ruleset `code_scanning` rule would leave every queued
# PR waiting forever for a result that never arrives. This advanced-setup
# workflow adds `merge_group`, which is the one thing that makes enforcement
# possible: a PR that introduces a high/critical alert cannot reach main.
#
# Same languages and query suite as the default setup it replaces. Every
# language uses build-mode `none`, so nothing is compiled and no build
# toolchain is needed.
#
# Timing (measured on the default-setup run 35894846966): rust ~18 min,
# javascript-typescript ~2 min, actions <1 min.
#
# Status 2026-09-26: default setup is OFF and this workflow owns scanning. The
# `code_scanning` rule was never added (see the note on `on:` below), so the
# merge_group trigger this header describes has been removed until it is.

name: CodeQL

# NO merge_group trigger, as of 2026-09-26. It only matters once the ruleset
# carries a `code_scanning` rule, and that rule was deliberately NOT added
# (2026-09-24): NOTICE-healed Dependabot PRs have no CodeQL result, so the rule
# would freeze dependency updates. Until then the queue runs gated nothing. They
# did cost 3 jobs per entry (rust ~17 min) against the free plan's 20-job
# concurrency cap, and on 2026-09-25 #735's entry waited 8.2 min for a runner
# while three entries overlapped. PR and push-to-main runs still scan every
# change, and the ruleset's review-thread rule still blocks merges on open
# CodeQL PR comments. If the code_scanning rule is ever added, restore
# `merge_group: {}` FIRST, or every queued PR waits forever.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries find old code even when nothing merges.
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The `default` suite, which is what default setup ran and what the
          # 2026-09-24 triage cleared. `security-extended` finds more, but
          # adopting it should be its own triage, not a side effect of the gate.

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}

  # ─────────────────────────────────────────────────────────────────────
  # main-alert: CodeQL findings used to block a merge only through the ruleset's
  # review-thread rule, which works when CodeQL comments on the PR BEFORE the
  # merge. Rust analysis takes ~16 min on a PR. Since 2026-09-26 a PR can merge
  # in ~15-20 min, so the comment can land after the merge, and nothing watched
  # main for alerts (0 open at the time of writing, none monitored).
  #
  # After every push-to-main (and the weekly scan) this keeps ONE issue,
  # labelled `codeql-main`, open while any code-scanning alert is open, and
  # closes it when the count returns to zero. The baseline is zero, so an open
  # issue always means a finding that reached main. It lists each alert with
  # its rule and location.
  # ─────────────────────────────────────────────────────────────────────
  main-alert:
    name: main code-scanning alert
    needs: [analyze]
    if: ${{ always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - name: Open, update or close the codeql-main issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        with:
          script: |
            const LABEL = 'codeql-main';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const sha = context.sha.slice(0, 8);
            // An analysis that failed has uploaded nothing new, so the alert
            // list would describe an older commit. Say so instead of reporting
            // that main is clean.
            if (process.env.ANALYZE_RESULT !== 'success') {
              core.warning(`CodeQL analysis did not succeed (${process.env.ANALYZE_RESULT}); alert state not updated`);
              return;
            }
            const alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
              ...context.repo, state: 'open', ref: 'refs/heads/main', per_page: 100,
            });
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 10,
            });
            const issue = open[0];
            if (alerts.length === 0) {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                  body: `Resolved: no open code-scanning alerts on main at ${sha}. ${runUrl}` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
                core.info(`Closed #${issue.number}`);
              }
              return;
            }
            const lines = [
              `## ${alerts.length} open code-scanning alert(s) on main at \`${sha}\``,
              '',
              'A finding reached main. Fix it, or dismiss it with a written reason in the Security tab. This issue closes itself when none are open.',
              '',
            ];
            for (const a of alerts.slice(0, 50)) {
              const loc = a.most_recent_instance?.location;
              const sev = a.rule?.security_severity_level || a.rule?.severity || 'n/a';
              lines.push(`- [#${a.number}](${a.html_url}) **${sev}** \`${a.rule?.id}\` at \`${loc?.path}:${loc?.start_line}\``);
            }
            lines.push('', runUrl);
            const body = lines.join('\n');
            if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              core.info(`Updated #${issue.number}`);
            } else {
              const { data } = await github.rest.issues.create({ ...context.repo,
                title: `Code scanning: ${alerts.length} open alert(s) on main`, body, labels: [LABEL] });
              core.info(`Opened #${data.number}`);
            }
