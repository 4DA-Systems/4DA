# Hermetic Fresh-Clone
#
# Proves that a PRISTINE checkout — with ZERO operator state — compiles and
# tests green on its own. This is the one thing the main `Validate` workflow
# CANNOT prove — though no longer for the original reason. Validate is now
# entirely GitHub-hosted: the Rust matrix moved in #159, and Frontend + MCP
# Server followed once that single self-hosted runner became the merge queue's
# throughput ceiling. So "hosted vs the operator's box" is no longer the
# distinction. What still separates the two is CACHING and ISOLATION — Validate
# restores a pnpm store and a cargo cache and never asserts a cold path, while
# this job clones cold, installs from nothing (exercising the postinstall
# OCR-model fetch), and pins FOURDA_DATA_DIR to a throwaway path.
#
# Historically the gap WAS operator state: the self-hosted runner carried
# pre-fetched OCR models, a populated `data/4da.db`, and a warm cargo cache.
# Both 2026-06-13 pre-launch findings were that failure class — green in the
# operator's tree, broken on a fresh clone:
#   Finding 1 (e77e6020): gitignored OCR bundle resource → `cargo` build fails
#                         with "resource path `models` doesn't exist".
#   Finding 2 (b047dd36): blind-spots unit tests read the live SQLite corpus.
# Neither could surface on a cached, operator-state-carrying run. This job is
# the canary that
# makes that whole class impossible to land silently — and the gate that must
# pass before the repo is flipped public (a contributor's first `git clone`).
#
# DESIGN NOTES
# - Runs on GitHub-HOSTED runners only (ephemeral VMs, no operator filesystem).
# - NO build/registry cache, BY DESIGN. The value here is proving a cold build;
#   caching would hide exactly the regressions this job exists to catch.
# - Replicates the real contributor path verbatim:
#     git clone → toolchain → system deps → pnpm install (postinstall fetches
#     the OCR models) → build + test frontend, MCP server, and Rust.
# - Data-dir isolation is belt-and-suspenders: hosted VMs are already pristine,
#   but pinning FOURDA_DATA_DIR/FOURDA_DB_PATH to a throwaway temp path means a
#   regression that reintroduces live-DB coupling fails HERE loudly instead of
#   passing by luck.
# - macOS fresh builds are covered by release.yml's bundle jobs; this gate is
#   ubuntu (the contributor/CI canary that caught Finding 1) + windows (the
#   operator's own platform).

name: Hermetic Fresh-Clone

on:
  # ADVISORY on PRs, and deliberately NOT a merge-queue check (no merge_group
  # trigger). History, so this is not re-litigated blind:
  #   - 2026-09-24 (#682): made REQUIRED, with a merge_group trigger, after #635
  #     (vitest 5 in mcp-4da-server) merged with `Fresh clone (windows-latest)`
  #     red and Validate green.
  #   - 2026-09-26: required-ness removed. The cold, cacheless windows leg
  #     (13.5 min compile + 7 min tests on 4 vCPU) became the queue's slowest
  #     job at 22-26 min, ~5-7 min past Validate. Its only failure in 60 runs
  #     was a timing flake (the watcher panic test, fixed in #737). That flake
  #     ejected #735 and cost 30 min. Each entry also started 3 more jobs
  #     against the free plan's 20-concurrent-job cap, and #735's entry waited
  #     8.2 min for a runner.
  # What replaces the gate: every push to main still runs the full canary
  # (below), and `main-alert` turns a red push or nightly run into an open
  # issue within ~25 min of the merge. Windows breakage is caught just after
  # the merge instead of just before.
  #   - 2026-09-26 (later): the pull_request trigger went too. Once the gate
  #     was gone, a PR run could not stop anything: auto-merge queues a PR ~5 min
  #     after it opens and the queue merges it ~10-12 min later, while this cold
  #     build takes 20-25 min. Every code PR still paid 3 jobs against the
  #     20-job cap for a result that arrived after the merge, and that is the
  #     cap that delays queue entries. The push-to-main run checks the same
  #     code minutes later. To check a branch before merging, dispatch this
  #     workflow on it (`gh workflow run hermetic.yml --ref <branch>`).
  push:
    branches: [main]
  schedule:
    # 07:00 UTC daily — after the 06:00 nightly supply-chain audit, so a network
    # or dependency drift in the fresh-clone path is caught even with no PR open.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# Least privilege, stated explicitly (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

concurrency:
  group: hermetic-${{ github.ref }}
  # Never cancel. On main, a cancelled push run means that commit is never
  # fresh-clone-verified at all: 8a6d5995 (#666) was cancelled by #667's push
  # eight minutes later and has no post-merge canary result.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  fresh-clone:
    name: Fresh clone (${{ matrix.os }})
    # Runs on every trigger (push to main, nightly, dispatch). There is no PR
    # trigger any more, so the PR-only path detector and the `!cancelled()`
    # wrapper it forced on this job went with it.
    runs-on: ${{ matrix.os }}
    # Cold, cacheless build + full test suite on two platforms. Runs have
    # historically landed ~16-18 min; 45 caps a hung network fetch or a runner
    # that wedges, instead of burning the 6h default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        # bash is present on GitHub-hosted Windows (Git Bash) and Linux, so the
        # same fresh-clone commands run identically on both platforms.
        shell: bash
    steps:
      - name: Checkout (pristine — ephemeral runner, no operator state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install Linux system dependencies (tauri / webkit)
        if: runner.os == 'Linux'
        run: |
          # The GitHub-hosted runner images ship third-party apt sources that
          # 4DA does not use — Azure CLI and microsoft-prod among them — and
          # `apt-get update` fails WHOLESALE when any single one is unreachable.
          # On 2026-08-28 packages.microsoft.com returned 403 for the `noble`
          # azure-cli repo and killed the Rust job at 14 seconds, before a line
          # of 4DA compiled. The identical step passed on ubuntu-22.04 in the
          # same run, which is what localised it to the image's extra sources.
          # gtk/webkit come from Ubuntu's own repos, so drop the rest first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          corepack disable
          npm install -g --force pnpm@9.15.0
          pnpm --version

      - name: pnpm install (frozen) — exercises the postinstall OCR-model fetch
        # This is THE fresh-clone path. The root postinstall hook runs
        # scripts/fetch-ocr-models.cjs, which downloads the gitignored bundle
        # resources that Finding 1 proved a clone cannot build without.
        #
        # Retried (up to 3 attempts): better-sqlite3 — a direct root dependency
        # — falls back to a node-gyp source build whenever no prebuilt binary
        # matches the image's Node ABI (the 13.x line in particular), and that
        # native build flakes on windows-latest, which ships no Visual Studio.
        # A transient install failure must not masquerade as a broken fresh
        # clone; three attempts separates flake from finding. Anything still
        # failing after 3 tries IS the finding.
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::pnpm install --frozen-lockfile failed (attempt ${attempt}/3) - retrying"
              sleep 20
            fi
          done
          echo "::error::pnpm install --frozen-lockfile failed on all 3 attempts"
          exit 1

      - name: Assert OCR bundle resources present (regression guard, Finding 1)
        run: |
          missing=0
          for f in text-detection.rten text-recognition.rten; do
            if [ ! -f "src-tauri/models/$f" ]; then
              echo "::error::src-tauri/models/$f is missing after install — a fresh clone cannot build src-tauri"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -lh src-tauri/models/

      - name: Frontend — fresh build + tests
        run: |
          pnpm run build
          pnpm run test

      - name: MCP server — fresh install, build, tests
        # The install line carries the same better-sqlite3 native-build flake
        # as the root install above (better-sqlite3 is a direct dependency of
        # mcp-4da-server too — the 13.x bump PRs target exactly this package),
        # so it gets the same 3-attempt retry. Build and tests stay
        # single-shot: a failure there is real signal, not network weather.
        run: |
          for attempt in 1 2 3; do
            if pnpm --dir mcp-4da-server install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::mcp-4da-server pnpm install failed on all 3 attempts"
              exit 1
            fi
            echo "::warning::mcp-4da-server pnpm install failed (attempt ${attempt}/3) - retrying"
            sleep 20
          done
          pnpm --dir mcp-4da-server run build
          pnpm --dir mcp-4da-server run test

      # Cold compile + tests in ONE cargo invocation. A separate `--no-run`
      # compile step used to come first, and it forced a second full compile of
      # the fourda crate here. Tauri's `generate_context!` rewrites an OUT_DIR
      # asset mid-compile, so the next cargo command always sees the crate as
      # stale (see validate.yml's Rust test step). A compile failure still fails
      # this step before any test runs, so the build/resource failure class is
      # still reported as a build failure.
      #
      # `--tests` (not `--lib`): cargo's `--tests` selects every target with
      # `test = true` — lib unittests, bin unittests AND the integration tests
      # under src-tauri/tests/, so a fresh clone proves all of them build.
      - name: Rust — cold compile + hermetic tests (unit + integration, isolated data dir)
        working-directory: src-tauri
        env:
          # Force any data-dir resolution onto a path that holds no real DB, so
          # a reintroduced live-corpus dependency (Finding 2) fails here.
          #
          # The directory name must keep containing the substring "data":
          # src/state.rs::test_get_db_path_points_to_data_dir asserts the
          # resolved DB path contains "data" and ends with "4da.db". Renaming
          # this to something like "4da-hermetic" alone fails that test.
          FOURDA_DATA_DIR: ${{ runner.temp }}/4da-hermetic-data
          FOURDA_DB_PATH: ${{ runner.temp }}/4da-hermetic-data/4da.db
        # `--tests` widens this from the lib-only scope to lib + bins + the 154
        # real integration tests in src-tauri/tests/ (migration, pipeline,
        # source-resilience, stack-simulation) plus the victauri dogfood suite,
        # which self-skips without VICTAURI_E2E=1. Those had NEVER run in CI on
        # any workflow. All are hermetic by construction — pipeline_integration
        # uses an in-memory DB via fourda_lib::test_utils::test_db() and
        # migration_tests uses tempfile::tempdir() — so they are safe to run
        # under the isolated data dir above.
        run: cargo test --tests

  # ─────────────────────────────────────────────────────────────────────
  # Aggregate gate: a SINGLE status check to require in branch protection,
  # collapsing the ubuntu + windows matrix legs into one stable name. Renaming
  # or adding an OS leg cannot silently drop it from the gate. Only `success`
  # passes. `skipped` used to pass too, for path-filtered PR legs, and there is
  # no PR trigger any more. Mirrors validate.yml's
  # `validate-success` and victauri's `ci-success`.
  # ─────────────────────────────────────────────────────────────────────
  hermetic-success:
    name: Hermetic Success
    if: always()
    needs: [fresh-clone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the fresh-clone matrix succeeded
        shell: bash
        run: |
          # ALLOWLIST, not a denylist — the same fix #485 made to Validate
          # Success after a Relay job reported `abandoned` and the denylist
          # (`failure|cancelled` only) passed it GREEN. GitHub emits more
          # results than the documented four; only `success` may pass. (A
          # `skipped` leg once meant a path-filtered PR run. With no PR trigger, a
          # skip here would mean the canary silently did not run.)
          results='${{ join(needs.*.result, ',') }}'
          echo "dependency results: $results"
          if [ -z "$results" ]; then
            echo "::error::no dependency results were reported — refusing to pass a gate that measured nothing"
            exit 1
          fi
          bad=''
          IFS=',' read -ra parsed <<< "$results"
          for r in "${parsed[@]}"; do
            case "$r" in
              success) ;;
              *) bad="$bad $r" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::a Hermetic Fresh-Clone leg did not succeed ($results) — offending results:$bad"
            exit 1
          fi
          echo "all Hermetic Fresh-Clone legs succeeded"

  # ─────────────────────────────────────────────────────────────────────
  # main-alert: Hermetic no longer gates the merge queue, so a red canary on
  # main must be impossible to miss. It maintains ONE issue, labelled
  # `hermetic-main`: opened (or commented on) when a push-to-main or nightly
  # run fails, closed automatically by the next green one. So an open issue
  # always means "a fresh clone of main is broken right now", never history.
  # Same shape as validate.yml's `main-health`.
  # ─────────────────────────────────────────────────────────────────────
  main-alert:
    name: main fresh-clone alert
    needs: [hermetic-success]
    if: ${{ always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the hermetic-main issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          RESULT: ${{ needs.hermetic-success.result }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const LABEL = 'hermetic-main';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const sha = process.env.HEAD_SHA.slice(0, 8);
            const red = process.env.RESULT !== 'success';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 10,
            });
            const issue = open[0];
            if (!red) {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                  body: `Resolved: fresh clone of main is green again at ${sha} (${context.eventName}). ${runUrl}` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
                core.info(`Closed #${issue.number}`);
              }
              return;
            }
            const body = [
              `## Fresh clone of main FAILS at \`${sha}\` (${context.eventName}, ${process.env.RESULT})`,
              '',
              'Hermetic is not a merge-queue check, so this landed. A contributor cloning main today cannot build or test it on at least one platform. Failing legs:',
              runUrl,
              '',
              'Usually a Windows-only break (Validate runs Rust on ubuntu only). This issue closes itself on the next green push or nightly run.',
            ].join('\n');
            if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              core.info(`Updated #${issue.number}`);
            } else {
              const { data } = await github.rest.issues.create({ ...context.repo,
                title: `main is RED on a fresh clone (${sha})`, body, labels: [LABEL] });
              core.info(`Opened #${data.number}`);
            }
