name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref. This workflow is PR-only, so a new
# push to a PR makes the in-flight run moot — cancelling it frees the shared
# self-hosted runner immediately instead of queueing redundant work behind it.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # Detect which parts of the tree a PR actually touches, so the heavy jobs
  # below can skip when irrelevant. This is the throughput lever: most PRs (and
  # nearly every Dependabot npm-subpackage bump) touch ONE area, yet previously
  # paid for the full frontend + MCP + Rust-matrix suite on the single
  # self-hosted runner — the cause of the merge-queue backlog.
  #
  # CRITICAL: filtering is done at the JOB level (via this job's outputs), NOT
  # with `on: pull_request: paths:`. A required status check that is filtered
  # out at the workflow level never reports, which leaves branch protection
  # waiting forever ("Expected — Waiting for status"). Here the workflow always
  # runs and the `Validate Success` aggregate always reports; only the heavy
  # legs conditionally skip (a skipped leg counts as success in the aggregate).
  changes:
    name: Detect changes
    # PR-only: dorny/paths-filter resolves changed files via the API on PRs
    # (robust, no git history needed). On workflow_dispatch this job skips and
    # the heavy legs run via their `github.event_name == 'workflow_dispatch'`
    # clause, so the detector never runs where it lacks a reliable base diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      workflows: ${{ steps.filter.outputs.workflows }}
      uncovered: ${{ steps.uncovered.outputs.uncovered }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # ── Fail-safe: paths that NO filter below claims ─────────────────────
      # The filters below are an ALLOWLIST of areas CI knows how to validate,
      # and everything else fell through to "skipped == pass". site/,
      # paddle-webhook/, mcp-memory-server/, editors/vscode/ and .husky/ were
      # all invisible — while `Validate Success` is the ONLY required check and
      # auto-merge is enabled repo-wide. A Dependabot bump into the payment
      # webhook, or a PR weakening .husky/ itself, could merge green with no
      # build, test, lint or audit having run at all.
      #
      # This inverts the default: an unrecognised path now RUNS the generic
      # gate instead of silently passing, and any directory added in future is
      # covered on day one without editing this file.
      #
      # `predicate-quantifier: every` is REQUIRED here. The default ('some')
      # ORs the patterns, and a list of negations OR'd together matches every
      # file (any path outside src/ satisfies '!src/**'). With 'every' a file
      # must satisfy ALL patterns — i.e. sit outside every known area.
      #
      # Deliberately placed BEFORE the main filter step to keep this diff clear
      # of the end-of-job boundary that PR #418 inserts a new job into.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: uncovered
        with:
          predicate-quantifier: 'every'
          filters: |
            uncovered:
              - '!src/**'
              - '!src-tauri/**'
              - '!mcp-4da-server/**'
              - '!scripts/**'
              - '!public/**'
              - '!e2e/**'
              - '!.husky/**'
              - '!.github/**'
              - '!.claude/**'
              - '!docs/**'
              - '!**/*.md'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!index.html'
              - '!vite.config.*'
              - '!tsconfig*.json'
              - '!tailwind.config.*'

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            workflows:
              # '.github/**', not just workflows/: dependabot.yml, CODEOWNERS
              # and composite actions all change what CI does or what lands,
              # yet none of them used to trigger a single job.
              - '.github/**'
            rust:
              - 'src-tauri/**'
            frontend:
              - 'src/**'
              # .husky/ holds the local commit-msg / pre-push guards. A PR that
              # weakens them must not be able to merge without CI running.
              - '.husky/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'index.html'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - 'tailwind.config.*'
              - 'scripts/**'
              - 'public/**'
            mcp:
              - 'mcp-4da-server/**'

  frontend:
    name: Frontend
    needs: changes
    # The `!cancelled()` wrapper is LOAD-BEARING on all three heavy jobs.
    # `changes` is PR-only, so on workflow_dispatch it SKIPS — and GitHub skips
    # any job whose `needs` skipped unless the job's `if:` contains a status
    # function. The `github.event_name == 'workflow_dispatch'` clause below has
    # therefore never once fired: dispatch skipped Frontend, MCP Server and the
    # whole Rust matrix while `Validate Success` (`if: always()`) still reported
    # green. Same defect class as hermetic.yml's fresh-clone job.
    #
    # `uncovered` is the fail-safe from the detector above: a changed path that
    # no filter recognises runs this job — the repo-wide generic gate (file
    # sizes, release-channel integrity, IPC validation, root npm audit) —
    # rather than passing with nothing run. It deliberately does NOT trigger the
    # Rust matrix or MCP legs; those are 30-minute builds and an unrecognised
    # path is far more likely to be JS/config than Rust.
    if: ${{ !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.uncovered == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, windows, 4da]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          corepack disable
          npm install -g --force pnpm@9.15.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (npm)
        # npm retired the legacy audit endpoint on 2026-07-14 (HTTP 410) —
        # pnpm <=10, including the repo's pinned 9.15.0, can no longer audit
        # at all; only pnpm 11+ speaks the replacement bulk advisory endpoint.
        # This step therefore runs the audit through a ONE-SHOT pnpm 11 via
        # npx, leaving the global pnpm 9.15.0 (which installs and runs
        # everything else in this job) untouched. pm_on_fail=ignore stops
        # pnpm 11 from re-executing the root packageManager pin (pnpm@9.15.0),
        # whose audit is dead. Same pattern as nightly-audit.yml, proven
        # green there on 2026-07-15. Without this fix the required Validate
        # gate 410-failed on EVERY frontend-touching PR.
        env:
          pnpm_config_pm_on_fail: ignore
        run: npx -y pnpm@11.13.0 audit --audit-level=high

      - name: Check file sizes
        run: node scripts/check-file-sizes.cjs --ci

      - name: No console-window-flashing spawns (INV-043)
        run: node scripts/check-no-window-spawns.cjs

      - name: Release channel integrity
        run: node scripts/check-release-channel.cjs

      - name: Guard self-tests (scripts/*.test.cjs)
        # The guards immediately above (file sizes, no-window spawns, release
        # channel) have their OWN unit tests, and until now those tests ran in
        # no hook and no workflow — nothing verified that the guards still
        # detect what they claim to. `pnpm run validate` does not run in CI
        # either (this job runs its steps individually), so wiring them here is
        # what actually gates them. 53 tests across 6 files, ~5s.
        run: pnpm run test:scripts

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Validate IPC commands
        run: node scripts/validate-commands.cjs

      - name: Validate translations (i18n coverage)
        run: node scripts/validate-translations.cjs

      - name: Generate i18n type declarations
        run: pnpm run i18n:types

      - name: Vite cold-start smoke test
        # Catches the Vite dep-reshuffle class of failures (see CLAUDE.md
        # "Vite dep updates + running fourda.exe" gotcha). Cheap and
        # identifies module-resolution regressions before they reach prod.
        # Kill fourda.exe first — self-hosted runner may have it holding port 4444.
        run: |
          taskkill /F /IM fourda.exe 2>$null; $true
          pnpm run validate:vite-smoke

      - name: Run tests and verify count floor
        run: |
          pnpm run test -- --run 2>&1 | Out-File -FilePath test-output.txt -Encoding utf8
          $testExit = $LASTEXITCODE
          $output = Get-Content test-output.txt
          $output | Select-Object -Last 15
          if ($testExit -ne 0) {
            Write-Output "::error::Tests exited with code $testExit"
            exit 1
          }
          $count = 0
          foreach ($line in $output) {
            if ($line -match '(\d+)\s+passed') { $count = [int]$Matches[1] }
          }
          Write-Output "Frontend tests passed: $count"
          if ($count -lt 1000) {
            Write-Output "::error::Frontend test count dropped below 1000 (got $count)"
            exit 1
          }
          Remove-Item test-output.txt -ErrorAction SilentlyContinue

  mcp-server:
    name: MCP Server
    # Independent of `frontend` (the old needs:frontend chain forced these to
    # serialize and meant skipping frontend skipped everything downstream).
    # Gating on `changes` lets each leg run/skip on its own and parallelize
    # across multiple runners.
    needs: changes
    # See the `!cancelled()` note on the frontend job — without it the
    # workflow_dispatch clause is unreachable.
    if: ${{ !cancelled() && (needs.changes.outputs.mcp == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, windows, 4da]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          corepack disable
          npm install -g --force pnpm@9.15.0
          pnpm --version

      - name: Install dependencies
        working-directory: mcp-4da-server
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: mcp-4da-server
        run: pnpm run build

      - name: Run tests
        working-directory: mcp-4da-server
        run: pnpm run test

  rust:
    name: Rust (${{ matrix.label }})
    needs: changes
    # See the `!cancelled()` note on the frontend job — without it the
    # workflow_dispatch clause is unreachable.
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch') }}
    # GitHub-HOSTED ubuntu, NOT the self-hosted box. The self-hosted Windows
    # runner shares 16 cores with the whole fleet's dev/cargo churn, so Rust
    # compiles there crawl under contention (a cold leg false-timed-out at 45m,
    # forcing the 75m bump). Hosted runners are dedicated + ephemeral; with
    # Swatinem/rust-cache a warm build is ~3-5 min and is immune to fleet load.
    #
    # Platform coverage: default-feature `cargo test --lib` is already proven on
    # ubuntu AND windows by hermetic.yml's fresh-clone matrix, so default
    # behaviour keeps two-platform coverage. The trade-off is that the
    # EXPERIMENTAL-feature leg now runs on ubuntu only (it previously ran on the
    # self-hosted Windows box) — acceptable: the experimental surface is not
    # Windows-specific. Cost: cheap 1x ubuntu minutes (the macOS 10x tier is the
    # real billing risk, not this); deepening hosted-minute reliance is hedged by
    # the local pre-push gate. cargo-audit/deny use prebuilt binaries (taiki-e) to skip
    # a ~3-min source compile each.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            cargo-features: ''
            test-floor: 2000
          - label: experimental
            cargo-features: '--features experimental'
            test-floor: 0
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install Linux system dependencies (tauri / webkit)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        # `stable`, matching hermetic.yml. The clippy lints the latest stable
        # surfaces (incl. unix-cfg'd code the Windows self-hosted runner never
        # compiled) have been FIXED in source, so -D warnings passes here. The
        # repo's rust-toolchain.toml (1.93.1) still governs the actual build via
        # rustup where it is honored; this job's value is fast, parallel,
        # contention-free clippy/audit/test on a dedicated runner.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri
          # Save the cache only from main — PR builds reuse it but don't churn it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'

      - name: Fetch OCR bundle resources (build dependency)
        working-directory: .
        run: node scripts/fetch-ocr-models.cjs

      - name: Check formatting
        if: matrix.label == 'default'
        run: cargo fmt --check

      - name: Clippy lints
        run: cargo clippy ${{ matrix.cargo-features }} -- -D warnings

      - name: Install cargo-audit + cargo-deny (prebuilt)
        if: matrix.label == 'default'
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Security audit
        if: matrix.label == 'default'
        run: cargo audit

      - name: Supply chain policy check
        if: matrix.label == 'default'
        run: cargo deny check

      - name: Compile-gate (cargo test --no-run)
        # Fast-fail if the test binary stops compiling, before the slow test run.
        #
        # `--tests` (not `--lib`): cargo's `--tests` selects every target with
        # `test = true` — lib unittests, bin unittests AND the integration tests
        # under src-tauri/tests/. Under the old `--lib` scope the integration
        # suite was never compiled by this job, so it could rot undetected.
        run: cargo test --tests ${{ matrix.cargo-features }} --no-run

      - name: Run tests (unit + integration) and verify count floor
        # Was `--lib`, which silently excluded every one of the 154 real
        # integration tests in src-tauri/tests/ — including all 12 migration
        # tests and the repo's only old-schema forward-migration coverage —
        # against a migration chain with no checksums and no downgrade path.
        # They had never executed in ANY workflow.
        env:
          # Same throwaway-data-dir isolation hermetic.yml uses, so a test that
          # reaches for a real corpus fails here instead of passing by luck.
          # The directory name must keep containing the substring "data":
          # src/state.rs::test_get_db_path_points_to_data_dir asserts the
          # resolved DB path contains "data" and ends with "4da.db".
          FOURDA_DATA_DIR: ${{ runner.temp }}/4da-validate-data
          FOURDA_DB_PATH: ${{ runner.temp }}/4da-validate-data/4da.db
        run: |
          set -o pipefail
          cargo test --tests ${{ matrix.cargo-features }} 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          tail -n 10 test-output.txt
          if [ "$status" -ne 0 ]; then
            echo "::error::Tests exited with code $status"
            exit 1
          fi
          # SUM every binary's count, don't take the last. `--tests` runs many
          # binaries (lib + bins + each integration target), so the previous
          # `tail -1` would have read only the LAST binary's total (~162) and
          # tripped the floor on every run.
          count=$(grep -oE 'test result: ok\. [0-9]+ passed' test-output.txt \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          binaries=$(grep -cE '^test result:' test-output.txt || true)
          echo "Rust tests passed: $count across $binaries test binaries"
          floor=${{ matrix.test-floor }}
          if [ "$floor" -gt 0 ] && [ "$count" -lt "$floor" ]; then
            echo "::error::Rust test count dropped below $floor (got $count)"
            exit 1
          fi
          # Guards the regression this step exists to fix: if someone re-scopes
          # this to --lib, only ONE binary reports and the integration suite is
          # silently gone again. Observed on 2026-08-14: 9 binaries (lib, 3
          # bins, 5 integration targets).
          if [ "$floor" -gt 0 ] && [ "$binaries" -lt 5 ]; then
            echo "::error::only $binaries test binaries ran — the integration tests in src-tauri/tests/ did not execute (is this scoped to --lib again?)"
            exit 1
          fi
          rm -f test-output.txt

  # ─────────────────────────────────────────────────────────────────────
  # Aggregate gate: a SINGLE status check to require in branch protection.
  # Listing each matrix leg (Rust default / experimental, Frontend, MCP) as a
  # required check is brittle — renaming a job silently drops it from the gate.
  # This job depends on all of them and fails if any FAILED or was CANCELLED; a
  # SKIPPED job (a conditional leg that legitimately did not apply) passes.
  # Runs on a hosted runner so the gate itself never ties up the self-hosted box.
  # Require ONLY "Validate Success" (plus "Hermetic Success") in branch protection.
  # Pattern mirrors victauri's ci.yml `ci-success` job.
  # ─────────────────────────────────────────────────────────────────────
  validate-success:
    name: Validate Success
    if: always()
    # Includes `changes` so a failure in the path-detector itself is caught.
    # Path-filtered legs report "skipped", which the check below treats as pass.
    needs: [changes, frontend, mcp-server, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify all required jobs succeeded
        shell: bash
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "dependency results: $results"
          case ",$results," in
            *,failure,* | *,cancelled,*)
              echo "::error::a required Validate job failed or was cancelled ($results)"
              exit 1
              ;;
            *)
              echo "all required Validate jobs succeeded (or were skipped as not-applicable)"
              ;;
          esac

  # ── Cross-platform validation ──
  # Moved to .github/workflows/hermetic.yml (the "Hermetic Fresh-Clone" gate).
  # The old rust-macos / rust-linux jobs here were continue-on-error and rested
  # on a now-false premise — that victauri-plugin was a local path dependency
  # (../../runyourempire/victauri/) only present on the self-hosted runner.
  # victauri-plugin / victauri-test are now registry deps ("0.7", in Cargo.lock),
  # so a GitHub-hosted runner can do a real, GATING fresh build + test. That
  # lives in hermetic.yml (ubuntu + windows, no cache, isolated data dir), which
  # also regression-guards both 2026-06-13 fresh-clone findings. macOS bundles
  # are built in release.yml.
