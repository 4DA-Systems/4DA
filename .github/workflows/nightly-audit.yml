# Nightly supply-chain audit for 4DA.
#
# Runs every night at 06:00 UTC (≈ early evening AEST) on main. Executes:
#   1. cargo audit               — RustSec advisories against EVERY Cargo.lock
#      in the repo: src-tauri/ (desktop app) and relay/ (Team Relay server,
#      a standalone crate that is not a src-tauri workspace member).
#   2. cargo deny check          — licence/source/advisory policy (src-tauri)
#   3. pnpm audit                — npm advisories against EVERY pnpm-lock.yaml
#      in the repo: root (production deps only) plus each sub-project with
#      its own lockfile (site/, paddle-webhook/, mcp-4da-server/).
#      Sub-projects are audited with dev deps
#      included: their trees are almost entirely devDependencies
#      (eleventy, vercel CLI, tsc) and that build/deploy tooling IS the
#      supply chain for what they ship — a --prod audit there would scan
#      a near-empty set and stay blind to advisories Dependabot reports.
#
# If ANY of the three fire, an issue is opened (or an existing
# open one is reused) labelled `security` / `supply-chain` so it
# surfaces in the triage lane immediately.
#
# Manual runs via workflow_dispatch are supported — useful when a CVE
# drops during the day and you want to know if we're affected now.
#
# Action SHAs below mirror those used by release.yml / validate.yml
# so the pin surface stays uniform across workflows.

name: nightly-supply-chain-audit

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: nightly-supply-chain-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          # pnpm 11 (below) requires Node >=22.13.
          node-version: '22'

      - name: Setup pnpm
        # npm registry retired the legacy audit endpoints on 2026-07-14
        # (HTTP 410) — pnpm <=10 (incl. the repo's pinned 9.15.0) can no
        # longer audit AT ALL; only pnpm 11+ speaks the replacement bulk
        # advisory endpoint. Installed via npm -g (the validate.yml /
        # hermetic.yml pattern) because pnpm/action-setup hard-errors when
        # its `version` input differs from package.json's packageManager
        # (pnpm@9.15.0, which the rest of the repo keeps for installs).
        # This job only audits — it never writes a lockfile — so the
        # version split is safe.
        run: npm install -g --force pnpm@11.13.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: cargo audit (every Cargo.lock in the repo)
        id: cargo_audit
        continue-on-error: true
        run: |
          set +e
          EXIT_CODE=0
          OUTPUT=""
          # Every crate with its own Cargo.lock. `relay/` is NOT a workspace
          # member of src-tauri, so auditing src-tauri alone left the
          # TLS-terminating sync server completely unscanned (it had four
          # rustls-webpki certificate-validation advisories when this was
          # added, 2026-08-14). cargo-audit resolves its ignore list from
          # <dir>/.cargo/audit.toml, hence the `cd` per directory.
          for dir in src-tauri relay; do
            RESULT=$(cd "$dir" && cargo audit 2>&1)
            CODE=$?
            echo "=== cargo audit $dir — exit $CODE ==="
            echo "$RESULT"
            if [ "$CODE" -eq 0 ]; then
              OUTPUT="${OUTPUT}[$dir] clean"$'\n'
            else
              EXIT_CODE=1
              # Bound EACH directory's chunk rather than the concatenation. The
              # single `tail -c 6000` at the end kept only the LAST directory's
              # text, so with two or more failing directories the earlier ones
              # were dropped entirely from both the annotation and the issue.
              OUTPUT="${OUTPUT}[$dir] FAILED (exit $CODE):"$'\n'"$(printf '%s' "$RESULT" | tail -c 2500)"$'\n'
            fi
          done
          set -e
          # Bound what becomes a step output. The full text is later handed to
          # the issue-reporter through the process environment, and an unbounded
          # value (cargo deny dumps the whole dependency tree) overflows it with
          # "Argument list too long" — which silently broke failure reporting.
          {
            echo "exit_code=$EXIT_CODE"
            echo "output<<CARGO_AUDIT_EOF"
            printf '%s\n' "$OUTPUT" | tail -c 6000
            echo "CARGO_AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: cargo deny check
        id: cargo_deny
        continue-on-error: true
        working-directory: src-tauri
        run: |
          set +e
          OUTPUT=$(cargo deny check 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          {
            echo "exit_code=$EXIT_CODE"
            echo "output<<CARGO_DENY_EOF"
            printf '%s\n' "$OUTPUT" | tail -c 6000
            echo "CARGO_DENY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: pnpm audit (root + sub-lockfiles, high+)
        id: pnpm_audit
        # No `pnpm install` needed: `pnpm audit` reads pnpm-lock.yaml only.
        # pnpm_config_pm_on_fail=ignore stops pnpm 11 from silently
        # re-executing the root packageManager pin (pnpm@9.15.0), whose
        # audit is dead against the retired registry endpoint.
        env:
          pnpm_config_pm_on_fail: ignore
        continue-on-error: true
        run: |
          set +e
          EXIT_CODE=0
          OUTPUT=""
          # ".:--prod" = root, production deps only (unchanged policy).
          # Sub-projects include dev deps — see header comment for why.
          for entry in ".:--prod" "site:" "paddle-webhook:" "mcp-4da-server:"; do
            dir="${entry%%:*}"
            flags="${entry#*:}"
            RESULT=$(pnpm --dir "$dir" audit $flags --audit-level=high 2>&1)
            CODE=$?
            echo "=== pnpm audit $dir ${flags:+($flags)} — exit $CODE ==="
            echo "$RESULT"
            if [ "$CODE" -eq 0 ]; then
              OUTPUT="${OUTPUT}[$dir] clean"$'\n'
            else
              EXIT_CODE=1
              # Per-directory bound — see the cargo-audit step for why the single
              # trailing `tail -c` silently discarded all but the last failure.
              OUTPUT="${OUTPUT}[$dir] FAILED (exit $CODE):"$'\n'"$(printf '%s' "$RESULT" | tail -c 1200)"$'\n'
            fi
          done
          set -e
          {
            echo "exit_code=$EXIT_CODE"
            echo "output<<PNPM_AUDIT_EOF"
            printf '%s\n' "$OUTPUT" | tail -c 6000
            echo "PNPM_AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue on any failure
        if: >-
          steps.cargo_audit.outputs.exit_code != '0' ||
          steps.cargo_deny.outputs.exit_code != '0' ||
          steps.pnpm_audit.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          CARGO_AUDIT_EXIT: ${{ steps.cargo_audit.outputs.exit_code }}
          CARGO_AUDIT_OUT:  ${{ steps.cargo_audit.outputs.output }}
          CARGO_DENY_EXIT:  ${{ steps.cargo_deny.outputs.exit_code }}
          CARGO_DENY_OUT:   ${{ steps.cargo_deny.outputs.output }}
          PNPM_AUDIT_EXIT:  ${{ steps.pnpm_audit.outputs.exit_code }}
          PNPM_AUDIT_OUT:   ${{ steps.pnpm_audit.outputs.output }}
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const today = new Date().toISOString().slice(0, 10);
            const section = (name, exit, out) => {
              const truncated = (out || '').slice(0, 6000);
              return [
                `### ${name}`,
                `exit code: \`${exit}\``,
                '',
                '```',
                truncated,
                '```',
                ''
              ].join('\n');
            };

            // Reuse an existing open issue from a previous nightly if present,
            // to avoid issue spam while a CVE is still unpatched.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'supply-chain,nightly-audit',
              per_page: 10,
            });
            const match = existing.data.find(i => i.title.startsWith('Nightly supply-chain audit failure'));

            // ── Make a SUSTAINED outage visible ─────────────────────────────
            // Reusing one issue is right (no spam) but it made night 26 of an
            // unbroken outage read exactly like night 1: a fresh comment on a
            // page nobody re-opens, under a title frozen at the first failure's
            // date. Issue #367 silently absorbed ~26 nightly reports that way.
            // Count the streak, put it in the comment AND in the title, so the
            // duration is legible from the issue list without opening anything.
            let streak = 1;
            let since = today;
            if (match) {
              since = (match.created_at || '').slice(0, 10) || today;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                per_page: 100,
              });
              // Each prior nightly failure left exactly one comment, plus the
              // issue body itself for the first night.
              streak = comments.filter(c => (c.body || '').includes('Nightly supply-chain audit fired')).length + 1;
            }
            const nights = streak === 1 ? 'night 1' : `${streak} CONSECUTIVE nights`;

            const body = [
              `Nightly supply-chain audit fired.`,
              '',
              `**Failing for ${nights}** (first failure: ${since}). Latest: ${today}.`,
              streak >= 3
                ? `> This is not a new alert. The audit has been red every night since ${since} and nothing has been merged to fix it.`
                : '',
              '',
              `- Run: ${runUrl}`,
              '',
              section('cargo audit',     process.env.CARGO_AUDIT_EXIT, process.env.CARGO_AUDIT_OUT),
              section('cargo deny check', process.env.CARGO_DENY_EXIT, process.env.CARGO_DENY_OUT),
              section('pnpm audit (root --prod + sub-lockfiles, high+)', process.env.PNPM_AUDIT_EXIT, process.env.PNPM_AUDIT_OUT),
            ].join('\n');

            const title = streak === 1
              ? `Nightly supply-chain audit failure — ${today}`
              : `Nightly supply-chain audit failure — ${streak} consecutive nights since ${since}`;

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              if (match.title !== title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: match.number,
                  title,
                });
              }
              core.info(`Appended to existing issue #${match.number} (streak: ${streak})`);
              core.exportVariable('AUDIT_STREAK', String(streak));
              core.exportVariable('AUDIT_SINCE', since);
              core.exportVariable('AUDIT_ISSUE', String(match.number));
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'supply-chain', 'nightly-audit'],
              });
              core.info(`Opened issue #${created.data.number}`);
              core.exportVariable('AUDIT_STREAK', '1');
              core.exportVariable('AUDIT_SINCE', since);
              core.exportVariable('AUDIT_ISSUE', String(created.data.number));
            }

      - name: Fail job if any audit failed
        # This step used to be the ONLY red thing in the run — the three audits
        # above are `continue-on-error`, so each renders green — and all it said
        # was "see opened issue". `gh run view --log-failed` therefore returned
        # a single sentence with no diagnostic in it, and the actual
        # per-directory detail lived exclusively in an auto-appended comment on
        # one GitHub issue. 26 nights of failure looked identical to one.
        #
        # release.yml:216-220 already states the principle this violates, about
        # its own former masked cargo-deny check: "A policy check that cannot
        # block and cannot be read is decoration." This one blocked. It could
        # not be read. Same defect, other half.
        if: >-
          steps.cargo_audit.outputs.exit_code != '0' ||
          steps.cargo_deny.outputs.exit_code != '0' ||
          steps.pnpm_audit.outputs.exit_code != '0'
        env:
          CARGO_AUDIT_EXIT: ${{ steps.cargo_audit.outputs.exit_code }}
          CARGO_AUDIT_OUT:  ${{ steps.cargo_audit.outputs.output }}
          CARGO_DENY_EXIT:  ${{ steps.cargo_deny.outputs.exit_code }}
          CARGO_DENY_OUT:   ${{ steps.cargo_deny.outputs.output }}
          PNPM_AUDIT_EXIT:  ${{ steps.pnpm_audit.outputs.exit_code }}
          PNPM_AUDIT_OUT:   ${{ steps.pnpm_audit.outputs.output }}
        run: |
          # Annotations must be single-line, so fold newlines into the literal
          # %0A that the Actions log viewer renders as a line break.
          annotate() {
            local title="$1" body="$2"
            printf '::error title=%s::%s\n' "$title" "$(printf '%s' "$body" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')"
          }

          STREAK="${AUDIT_STREAK:-1}"
          SINCE="${AUDIT_SINCE:-unknown}"
          if [ "$STREAK" -gt 1 ] 2>/dev/null; then
            echo "::error title=Sustained supply-chain outage::Red for ${STREAK} CONSECUTIVE nights (since ${SINCE}). Tracking issue #${AUDIT_ISSUE:-?}. This is not a new alert."
          fi

          [ "${CARGO_AUDIT_EXIT}" = "0" ] || annotate "cargo audit" "${CARGO_AUDIT_OUT}"
          [ "${CARGO_DENY_EXIT}"  = "0" ] || annotate "cargo deny check" "${CARGO_DENY_OUT}"
          [ "${PNPM_AUDIT_EXIT}"  = "0" ] || annotate "pnpm audit" "${PNPM_AUDIT_OUT}"

          # Also mirror the whole thing into the run summary, which survives log
          # retention rules and is readable without expanding a failed step.
          {
            echo "## Nightly supply-chain audit — FAILED"
            echo ""
            echo "Consecutive failing nights: **${STREAK}** (since ${SINCE}). Tracking issue: #${AUDIT_ISSUE:-?}"
            for pair in "cargo audit:${CARGO_AUDIT_EXIT}:CARGO_AUDIT_OUT" \
                        "cargo deny check:${CARGO_DENY_EXIT}:CARGO_DENY_OUT" \
                        "pnpm audit:${PNPM_AUDIT_EXIT}:PNPM_AUDIT_OUT"; do
              name="${pair%%:*}"; rest="${pair#*:}"; code="${rest%%:*}"; var="${rest#*:}"
              echo ""
              echo "### ${name} (exit ${code})"
              echo '```'
              printf '%s\n' "${!var}"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::One or more supply-chain audits failed — details annotated above and in the run summary."
          exit 1
