name: Publish @4da/mcp-server

on:
  push:
    tags:
      - 'mcp-v*'

jobs:
  publish:
    name: Build, Test & Publish to npm + MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp-4da-server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.15.0 # match packageManager; unpinned drifts to pnpm 10 (Node >=22.13) and mismatches the pnpm-9 lockfile

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          # No registry-url: that input writes an .npmrc pointing auth at
          # NODE_AUTH_TOKEN, which is the token flow this workflow no longer
          # uses (see the publish step).

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm test

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) doesn't match tag (mcp-v$TAG_VERSION)"
            exit 1
          fi
          echo "Publishing @4da/mcp-server@$PKG_VERSION"

      # Auth is npm TRUSTED PUBLISHING (OIDC), not a token. History: the
      # NPM_TOKEN flow died twice — 5.0.0 needed an operator one-shot token,
      # and the 5.0.2 run failed E404-on-PUT on a dead secret (2026-08-17).
      # Granular tokens expire within 90 days, so a token here is a scheduled
      # future outage. OIDC needs npm >= 11.5.1 (Node 22 bundles npm 10) and
      # the `id-token: write` permission this job already has. Prerequisite,
      # one-time, on npmjs.com: package @4da/mcp-server -> Settings ->
      # Trusted Publisher -> GitHub Actions, repository 4DA-Systems/4DA,
      # workflow publish-mcp-server.yml. Until that is configured this step
      # fails with an auth error, same as the dead token did.
      #
      # Idempotent: a partial failure after npm publish (e.g. the registry
      # step) must be retryable by re-pushing the tag without a version bump.
      # NOTE: re-pushing a tag runs the workflow file AS OF THE TAGGED COMMIT
      # — to publish an already-tagged version through THIS flow, delete and
      # re-create the tag on a commit that contains this workflow revision.
      - name: Publish to npm via Trusted Publishing (skip if version already live)
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@4da/mcp-server@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@4da/mcp-server@$PKG_VERSION already on npm — skipping publish"
          else
            npm install -g npm@11
            npm --version
            npm publish --access public
          fi

      - name: Install mcp-publisher (version-pinned + SHA-256 verified)
        # Was: `curl -L .../releases/latest/download/... | tar xz mcp-publisher`
        # — an unpinned binary from a third-party repo, streamed straight into
        # tar with no checksum, and then run two steps later WITH THIS
        # WORKFLOW'S PUBLISH CREDENTIALS (npm token in the env, GitHub OIDC
        # identity available to `mcp-publisher login github-oidc`). `latest`
        # means the binary can change under us between two runs of the same tag,
        # and nothing would notice.
        #
        # The upstream project publishes a signed checksums file per release, so
        # there is no excuse for the unverified form. Refresh VERSION and SHA
        # together, from registry_<version>_checksums.txt on the release page.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$ASSET" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ASSET}"
          echo "${MCP_PUBLISHER_SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "$ASSET" mcp-publisher
          rm -f "$ASSET"
          ./mcp-publisher --version || true

      - name: Sync server.json version with tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          jq --arg v "$TAG_VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
