name: Deploy site

# 4da.ai is a Cloudflare Pages direct-upload project (no Git integration), so a
# merged site change was NOT live until someone ran `wrangler pages deploy` by
# hand. That gap was real: #834/#835 (Signal pricing page) sat merged but
# unpublished until an unrelated deploy carried them on 2026-10-05. This
# publishes every site change on main, then smoke-tests production.
#
# Needs two repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   scoped token, permission "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the 4da-site Pages project
# Until both exist the job reports "skipped: no Cloudflare credentials" and
# exits green, so this file can merge before the token is created.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time, in merge order; never cancel a deploy mid-upload.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy 4da.ai
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::skipped: no Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) — site NOT deployed"
            echo "### Site not deployed: Cloudflare credentials are not configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: steps.creds.outputs.present == 'true'

      - name: Setup pnpm
        if: steps.creds.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6

      - name: Setup Node.js
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        if: steps.creds.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: pnpm run build

      - name: Deploy to production
        if: steps.creds.outputs.present == 'true'
        # --branch main is what makes it a PRODUCTION deploy on Pages.
        run: pnpm exec wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA"

      - name: Smoke-test production
        if: steps.creds.outputs.present == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          # Pages takes a few seconds to switch the production alias.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://4da.ai/) && [ "$code" = "200" ] && break
            sleep 10
          done
          for path in / /signal /download /activate; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://4da.ai$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::https://4da.ai$path returned $code after deploy"; exit 1; }
          done
          # The licence signing key must still match the app's public key.
          health=$(curl -s https://4da.ai/api/license/health)
          echo "$health" | grep -q '"matches_app":true' || { echo "::error::licence health check failed: $health"; exit 1; }
          echo "production smoke test passed"
