name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      production: ${{ steps.tagkind.outputs.production }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # A `v*` tag is not necessarily a release. This workflow triggers on the
      # whole `v*` glob and the repo's history holds eight `v0.0.N-test` dry-run
      # tags. Classified ONCE here, as a job output, so every publishing step
      # downstream reads the same answer.
      - name: Classify the tag
        id: tagkind
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is a production version tag - artifacts will be published."
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dry run::$TAG is not a production version tag. Everything builds and is verified, but nothing is published: the release stays a DRAFT, the desktop-latest updater pointer is untouched, and the MCP server is not published to npm."
          fi

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.version.outputs.version }}`,
              name: `4DA v${{ steps.version.outputs.version }}`,
              body: `## Download\n\nPick the installer for your platform below.\n\n| Platform | File |\n|----------|------|\n| Windows | \`.exe\` (NSIS installer) |\n| macOS | \`.dmg\` |\n| Linux | \`.AppImage\` or \`.deb\` |\n\n---\n\nSee [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for details.`,
              draft: true,
              prerelease: false,
            })
            return data.id

  build-tauri:
    name: Build (${{ matrix.label }})
    needs: create-release
    # Observed full-matrix run time is ~45-60 min (the last real run failed at
    # 46m28s). 90 min leaves ~50% headroom for a cold Rust cache and a slow
    # Apple notarization queue while still catching a genuine hang, instead of
    # inheriting the 6-hour default and burning a runner all afternoon.
    timeout-minutes: 90
    permissions:
      contents: write
      # Required for Sigstore/cosign KEYLESS signing of the SBOMs below.
      # Without an OIDC token `cosign sign-blob --yes` cannot mint a
      # certificate and fails - which is exactly why those steps had been
      # neutered with `|| true` and had never once produced a signature.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            runner: macos-14
            target: x86_64-apple-darwin
          - label: Linux
            # ubuntu-22.04 is the minimum - Tauri 2.0 requires libwebkit2gtk-4.1-dev
            # which is NOT available on ubuntu-20.04 (only has webkit2gtk 4.0)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    steps:
      # ---------------------------------------------------------------------
      # THE credential gate. There is exactly one, and it fails closed.
      #
      # This workflow triggers ONLY on a `v*` tag, so every run publishes a
      # real release to real users. 4DA does not ship unsigned installers:
      # an unsigned .exe is flagged by SmartScreen and an unsigned or
      # un-notarized .app is refused by Gatekeeper.
      #
      # Previously the signing steps AND their verification steps were each
      # gated on `env.SSL_COM_CREDENTIAL_ID != ''` / `env.APPLE_CERTIFICATE
      # != ''`. A lapsed, rotated or unset secret therefore skipped the
      # signing AND skipped the check that would have caught it, publishing
      # unsigned installers under a green tick. Gating a check on the same
      # condition as the thing it checks makes the check unable to fail.
      #
      # So: signing stays conditional on the platform (you cannot sign
      # without a cert), but the CREDENTIAL requirement is asserted here,
      # once, up front - in seconds rather than 45 minutes into the build -
      # and verification below is now unconditional.
      # ---------------------------------------------------------------------
      - name: Preflight - require signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          MISSING=()
          require() { if [ -z "${!1:-}" ]; then MISSING+=("$1"); fi; }

          # Updater manifest signing - required on EVERY platform. Without this
          # key tauri-action emits no updater artifacts and no latest.json, and
          # `publish-release` then fails its required-artifact check only AFTER
          # the entire four-platform matrix has finished building.
          require TAURI_SIGNING_PRIVATE_KEY

          case "${{ runner.os }}" in
            Windows)
              require SSL_COM_USERNAME
              require SSL_COM_PASSWORD
              require SSL_COM_CREDENTIAL_ID
              require SSL_COM_TOTP_SECRET
              ;;
            macOS)
              require APPLE_CERTIFICATE
              require APPLE_CERTIFICATE_PASSWORD
              require APPLE_SIGNING_IDENTITY
              require APPLE_ID
              require APPLE_PASSWORD
              require APPLE_TEAM_ID
              ;;
          esac

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Signing credentials missing for ${{ matrix.label }} - release blocked."
            printf '  - %s (unset or empty)\n' "${MISSING[@]}"
            echo ""
            echo "Every run of this workflow is a tagged, published release, and 4DA"
            echo "does not ship unsigned installers. Restore the secrets listed above"
            echo "and re-run this workflow."
            exit 1
          fi
          echo "All required signing credentials are present for ${{ matrix.label }}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.15.0 # match packageManager; unpinned drifts to pnpm 10 (needs Node >=22.13) and breaks the Node-20 job

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          # Node 22 (was 20): on Node 20 the Windows leg's `better-sqlite3`
          # prebuild-install finds no matching ABI prebuilt, falls back to a
          # node-gyp native build, and node-gyp's Visual Studio finder crashes
          # (ERR_CHILD_PROCESS_STDIO_MAXBUFFER) -> install fails before signing.
          # Node 22 has a published prebuilt (proven green by hermetic.yml's
          # Node-22 windows leg), so no native build is attempted.
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: src-tauri

      - name: Ensure cross-compilation target is installed
        shell: bash
        run: |
          # The project pins a specific Rust toolchain via src-tauri/rust-toolchain.toml.
          # Running from src-tauri/ ensures rustup installs the target on THAT toolchain
          # (not the 'stable' one from dtolnay/rust-toolchain).
          cd src-tauri && rustup target add ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify OCR models (SHA-256 pinned)
        # Was two bare `curl -sSL` calls with NO integrity check whatsoever,
        # feeding two multi-megabyte third-party blobs straight into the bundle
        # that this workflow then EV-signs and notarizes. The signature attested
        # to bytes nobody had verified. Three lines above, the same workflow
        # SHA-256-pins CodeSignTool and hard-fails on mismatch; the models now
        # get the same treatment, through the one script that owns the pins
        # (scripts/fetch-ocr-models.cjs) so the dev and release paths cannot
        # drift apart. `--require` makes a network failure fatal here — a
        # release must not proceed without verified models — while a developer's
        # offline `pnpm install` stays non-fatal.
        shell: bash
        run: |
          node scripts/fetch-ocr-models.cjs --require
          ls -lh src-tauri/models/

      # Supply-chain policy is a release gate, not a suggestion.
      #
      # Was: `cargo install cargo-deny --locked --quiet 2>/dev/null || true`
      # followed by `cargo deny check 2>/dev/null || echo "::warning::"`. That
      # could not fail the release, and `2>/dev/null` discarded the very
      # diagnostic a reviewer would need to act on the warning. A policy check
      # that cannot block and cannot be read is decoration.
      #
      # This is safe to harden: validate.yml runs `cargo deny check`
      # hard-blocking on every PR, so main already satisfies this policy. The
      # only way it can newly fail at tag time is a fresh advisory or a yanked
      # crate landing since the last validate run - precisely the case a
      # release must stop for.
      #
      # Runs once, on the cheapest runner: src-tauri/deny.toml pins [graph]
      # targets to all four release targets, so the verdict is identical on
      # every leg and running it four times would only burn minutes.
      - name: Install cargo-deny (prebuilt)
        if: matrix.label == 'Linux'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-deny

      - name: Supply chain policy check
        if: matrix.label == 'Linux'
        working-directory: src-tauri
        run: cargo deny check

      - name: Install SSL.com CodeSignTool (Windows EV signing)
        # Platform-conditional ONLY. Credential presence is already asserted by
        # the preflight gate, so re-gating on the secret here would recreate the
        # original defect: two independent steps testing the same condition, one
        # of which is supposed to police the other.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Download CodeSignTool for Windows
          $cstUrl = "https://www.ssl.com/download/codesigntool-for-windows/"
          $zipPath = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri $cstUrl -OutFile $zipPath -UseBasicParsing

          # SHA-256 verification of the downloaded CodeSignTool archive.
          # SSL.com publishes this download behind a stable URL without a
          # separate checksum endpoint. Keep the archive hash pinned here and
          # refresh it only after verifying an intentional CodeSignTool update.
          $expected = "317d429be3aa12a5f2c1ffdd575eab0cb0ce5e2408ab0056bcdcaab29875f73d"
          $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CodeSignTool.zip SHA-256: $actual"
          if ($actual -ne $expected.ToLowerInvariant()) { Write-Error "CodeSignTool SHA-256 mismatch - expected $expected, got $actual"; exit 1 }

          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          # Resolve the ABSOLUTE path to CodeSignTool.bat and export it as an env
          # var. The previous approach only added the dir to GITHUB_PATH, but the
          # signCommand subprocess tauri spawns did NOT see it on PATH
          # ("CodeSignTool: NOT FOUND on PATH" in the sign debug log), so signing
          # failed. sign-windows.ps1 now invokes $env:CODESIGNTOOL_BAT directly.
          $cstBat = Get-ChildItem -Path $extractPath -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1
          if (-not $cstBat) {
            Write-Error "CodeSignTool.bat not found under $extractPath after extraction"
            Get-ChildItem -Path $extractPath -Recurse -Depth 2 | Select-Object FullName | Format-Table -AutoSize
            exit 1
          }
          Write-Host "CodeSignTool.bat: $($cstBat.FullName)"
          echo "CODESIGNTOOL_BAT=$($cstBat.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Keep the dir on PATH too (belt-and-suspenders for any other consumer).
          echo "$($cstBat.Directory.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Pre-sign bundled ORT dylib (macOS notarization)
        # tauri bundles src-tauri/models/ort/libonnxruntime.dylib as a plain
        # *resource* and never code-signs it, so Apple notarization rejects the
        # whole app (issues #3087721/#3087733: the dylib is unsigned / lacks a
        # hardened runtime). Place the dylib now and sign it (hardened runtime +
        # secure timestamp) using a dedicated keychain set up here, BEFORE
        # tauri-action builds. tauri's beforeBuildCommand re-runs bundle:resources
        # but skips the dylib (already present >1MB), preserving this signature.
        # --keychain is passed explicitly so this does NOT disturb tauri-action's
        # own keychain/search-list used to sign the .app + notarize.
        # Platform-conditional ONLY - see the preflight gate for credentials.
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ort-sign.keychain-db"
          KPW="$(openssl rand -hex 20)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/ort-cert.p12"
          security import "$RUNNER_TEMP/ort-cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/ort-cert.p12"
          # Add our keychain to the user search list so `codesign` can actually
          # FIND the identity. `--keychain` alone is unreliable — codesign locates
          # signing identities via the search list, not the --keychain flag (that
          # was why the previous attempt still hit "item could not be found in the
          # keychain"). Prepend ours, keeping the existing entries. tauri-action
          # re-configures the search list afterwards for its own .app signing.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          # Place the ORT dylib (+ embedding model) now so we can sign the dylib.
          pnpm run bundle:resources
          DYLIB="src-tauri/models/ort/libonnxruntime.dylib"
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$DYLIB"
          codesign --verify --strict --verbose=2 "$DYLIB"
          echo "Pre-signed $DYLIB for notarization."

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # macOS signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows EV signing via SSL.com eSigner (cloud-based, no PFX needed)
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
          # Explicit - tauri-action generates and merges latest.json across
          # matrix jobs when updater signing is configured. The desktop updater
          # endpoint points at the dedicated desktop-latest manifest release,
          # so publish-release must copy this file there after validation.
          includeUpdaterJson: true

      - name: Windows signing debug log (always)
        # tauri suppresses the signCommand's output and reports only a generic
        # "failed to run powershell". sign-windows.ps1 tees the real CodeSignTool
        # output + exit code to this file; print it so the actual error is
        # visible whether or not the build step succeeded.
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/sign-windows-debug.log"
          if [ -f "$LOG" ]; then
            echo "===== sign-windows-debug.log ====="
            cat "$LOG"
            echo "===== end ====="
          else
            echo "::warning::no sign-windows-debug.log found (signCommand may not have run)"
          fi

      - name: Verify Windows Authenticode signature
        # UNCONDITIONAL on Windows - this is the whole point of the change.
        # Verification must never share a condition with the thing it verifies:
        # gating this on SSL_COM_CREDENTIAL_ID meant a lapsed or rotated secret
        # skipped signing AND skipped the detection of that skip, publishing
        # unsigned installers under a green tick.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = "src-tauri\target\${{ matrix.target }}\release\bundle"

          # "I verified nothing" must never be a pass. A missing bundle
          # directory - or a bundle path change that moves the artifacts out
          # from under this glob - previously produced a WARNING and a green
          # step. Both are now hard failures.
          if (-not (Test-Path $bundleDir)) {
            Write-Host "::error::Bundle directory not found: $bundleDir - nothing to verify, release blocked"
            exit 1
          }

          $bundles = @(Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi)
          $signed = 0; $failed = 0

          foreach ($f in $bundles) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -eq 'Valid') {
              Write-Host "  SIGNED: $($f.Name) - $($sig.SignerCertificate.Subject)"
              $signed++
            } else {
              # A `::error::` annotation rather than Write-Error, so every
              # offending file is listed before we exit instead of terminating
              # on the first one under $ErrorActionPreference = 'Stop'.
              Write-Host "::error::UNSIGNED: $($f.Name) - status: $($sig.Status)"
              $failed++
            }
          }

          Write-Host ""
          Write-Host "Signature check: $($bundles.Count) inspected, $signed signed, $failed unsigned"

          if ($bundles.Count -eq 0) {
            Write-Host "::error::No .exe or .msi found under $bundleDir - the build produced no installer, or the bundle layout changed. Release blocked."
            exit 1
          }
          if ($failed -gt 0) {
            Write-Host "::error::One or more binaries are unsigned - release blocked"
            exit 1
          }
          Write-Host "All $signed Windows artifact(s) carry a valid Authenticode signature."

      - name: Verify macOS code signature and notarization
        # UNCONDITIONAL on macOS - gating this on APPLE_CERTIFICATE meant a
        # missing cert skipped both the signing and the check for it.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # `-eu` but deliberately NOT `pipefail`, matching the original `set
          # -e`. The `find ... | head -1` lookups below are SIGPIPE-prone: once
          # a producer outruns the pipe buffer, head closes the read end and the
          # producer exits 141, which under pipefail+errexit would abort this
          # step on a perfectly healthy bundle (verified: `seq 1 500000 | head
          # -1` exits 141 with pipefail, 0 without). A bundle dir holds only a
          # handful of paths so it would not trip today, but pipefail buys
          # nothing here - there is no pipeline whose failure we need to catch -
          # and it would plant a latent, release-only failure.
          set -eu
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          # A missing bundle dir must fail, not silently verify nothing.
          if [[ ! -d "$BUNDLE_DIR" ]]; then
            echo "::error::Bundle directory not found: $BUNDLE_DIR - nothing to verify, release blocked"
            exit 1
          fi

          # Notarization evidence counter. Apple's proof of notarization is the
          # STAPLED ticket, which `stapler validate` reads offline and
          # deterministically. Which artifact carries the ticket depends on the
          # bundler version (tauri staples the .app; whether the .dmg container
          # is also stapled varies), so a proof from any legitimate location
          # counts - but AT LEAST ONE is required. Previously every
          # notarization signal was `|| echo ::warning`, so a completely
          # un-notarized build shipped green.
          NOTARIZED=0

          # The .dmg is the shipped, notarized artifact: bundle.targets lists
          # only "dmg" for macOS, so the .app is packaged INSIDE the .dmg and is
          # NOT necessarily left standalone in bundle/macos after packaging.
          # Gate on the .dmg being code-signed; verify a standalone .app too IF
          # one is present, but do not require it (that false-failed the previous
          # run even though tauri's build+sign+notarize succeeded).

          APP_PATH=$(find "$BUNDLE_DIR" -name "*.app" -maxdepth 4 | head -1)
          if [[ -n "$APP_PATH" ]]; then
            echo "=== .app bundle: $APP_PATH ==="
            if codesign --verify --deep --strict "$APP_PATH" 2>&1; then
              echo "  SIGNED: $(codesign -d --verbose=1 "$APP_PATH" 2>&1 | grep 'Authority=' | head -1)"
            else
              echo "::error::Code signature verification FAILED for the .app bundle"
              exit 1
            fi
            if xcrun stapler validate "$APP_PATH" 2>&1; then
              echo "  NOTARIZED: stapled ticket valid on the .app"
              NOTARIZED=1
            fi
            if spctl --assess --verbose --type execute "$APP_PATH" 2>&1; then
              echo "  NOTARIZED: Gatekeeper accepts the .app"
              NOTARIZED=1
            fi
          else
            echo "::notice::No standalone .app in $BUNDLE_DIR - expected (only .dmg is targeted; the notarized .app ships inside the .dmg)."
          fi

          # The .dmg is REQUIRED and must be signed - this is the release gate.
          DMG_PATH=$(find "$BUNDLE_DIR" -name "*.dmg" -maxdepth 4 | head -1)
          if [[ -z "$DMG_PATH" ]]; then
            echo "::error::No .dmg installer found in $BUNDLE_DIR - release blocked"
            exit 1
          fi
          echo "=== DMG installer: $DMG_PATH ==="
          if codesign --verify --strict "$DMG_PATH" 2>&1; then
            echo "  SIGNED: $(basename "$DMG_PATH")"
          else
            echo "::error::DMG signature verification FAILED - $(basename "$DMG_PATH") - release blocked"
            exit 1
          fi
          if xcrun stapler validate "$DMG_PATH" 2>&1; then
            echo "  NOTARIZED: stapled ticket valid on the .dmg"
            NOTARIZED=1
          fi
          if spctl --assess --verbose --type install "$DMG_PATH" 2>&1; then
            echo "  Gatekeeper accepts the .dmg installer"
            NOTARIZED=1
          fi

          # Most authoritative fallback: the .app that actually ships inside the
          # .dmg is what the user launches, so a stapled ticket there is proof
          # even when neither container above carries one.
          if [[ "$NOTARIZED" -eq 0 ]]; then
            MNT="$(mktemp -d)"
            if hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MNT" >/dev/null 2>&1; then
              INNER_APP="$(find "$MNT" -maxdepth 2 -name '*.app' | head -1)"
              if [[ -n "$INNER_APP" ]] && xcrun stapler validate "$INNER_APP" 2>&1; then
                echo "  NOTARIZED: stapled ticket valid on the .app inside the .dmg"
                NOTARIZED=1
              fi
              hdiutil detach "$MNT" >/dev/null 2>&1 || true
            fi
          fi

          if [[ "$NOTARIZED" -eq 0 ]]; then
            echo "::error::No notarization proof found for this build - release blocked."
            echo "  Checked: stapled ticket on the .app, on the .dmg, and on the .app inside"
            echo "  the .dmg, plus Gatekeeper assessment of both. An un-notarized build is"
            echo "  refused by Gatekeeper on end-user machines, so it must not ship."
            exit 1
          fi
          echo "macOS verification passed: .dmg is code-signed and notarization is proven."

      - name: Report binary sizes
        shell: bash
        run: |
          echo "## Binary Sizes (${{ matrix.label }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f | while read f; do
            SIZE=$(du -h "$f" | cut -f1)
            NAME=$(basename "$f")
            echo "| $NAME | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Build CLI binary
        working-directory: src-tauri
        run: cargo build --release --bin 4da --target ${{ matrix.target }}

      - name: Upload CLI binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="src-tauri/target/${{ matrix.target }}/release/4da.exe"
            NAME="4da-cli-${{ matrix.target }}.exe"
          else
            BIN="src-tauri/target/${{ matrix.target }}/release/4da"
            NAME="4da-cli-${{ matrix.target }}"
          fi
          cp "$BIN" "$NAME"
          gh release upload "$TAG" "$NAME" --clobber

      - name: Generate SHA-256 checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          CHECKSUMS_FILE="SHASUMS256-${{ matrix.target }}.txt"

          # Platform-aware hasher: macOS ships `shasum`, Linux + Windows (git-bash)
          # have `sha256sum`. Both produce identical `<hash>  <file>` output.
          if command -v sha256sum >/dev/null 2>&1; then
            HASHER="sha256sum"
          else
            HASHER="shasum -a 256"
          fi

          > "$CHECKSUMS_FILE"

          # Hash all installer artifacts produced by the Tauri bundler.
          # Ignore update bundles (.tar.gz / .zip with matching .sig) - those are
          # verified by Tauri's updater via the minisign signature, not SHA-256.
          if [[ -d "$BUNDLE_DIR" ]]; then
            find "$BUNDLE_DIR" -type f \( \
              -name "*.exe" -o \
              -name "*.msi" -o \
              -name "*.dmg" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" \
            \) | while read f; do
              NAME=$(basename "$f")
              HASH_LINE=$($HASHER "$f" | awk '{print $1}')
              echo "${HASH_LINE}  ${NAME}" >> "$CHECKSUMS_FILE"
              # Per-file sidecar - users can run `sha256sum -c <file>.sha256`
              echo "${HASH_LINE}  ${NAME}" > "${f}.sha256"
              gh release upload "$TAG" "${f}.sha256" --clobber
            done
          fi

          # Also hash the CLI binary uploaded earlier in this job.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            CLI_NAME="4da-cli-${{ matrix.target }}.exe"
          else
            CLI_NAME="4da-cli-${{ matrix.target }}"
          fi
          if [[ -f "$CLI_NAME" ]]; then
            HASH_LINE=$($HASHER "$CLI_NAME" | awk '{print $1}')
            echo "${HASH_LINE}  ${CLI_NAME}" >> "$CHECKSUMS_FILE"
            echo "${HASH_LINE}  ${CLI_NAME}" > "${CLI_NAME}.sha256"
            gh release upload "$TAG" "${CLI_NAME}.sha256" --clobber
          fi

          # Upload the consolidated per-platform checksum file.
          gh release upload "$TAG" "$CHECKSUMS_FILE" --clobber

          # Mirror to job summary so it's visible in the GitHub Actions UI.
          echo "## SHA-256 Checksums (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$CHECKSUMS_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Rust SBOM
        if: matrix.label == 'Windows'
        shell: bash
        run: |
          # SBOMs are a release-gate artefact - a silent "note" fallback would
          # publish a release with no machine-verifiable dependency inventory.
          # Hard-fail the job if generation breaks, so someone has to look.
          set -e
          cargo install cargo-cyclonedx --locked
          cd src-tauri
          cargo cyclonedx --format json --override-filename bom
          # cargo-cyclonedx emits `bom.json` next to each manifest; move the
          # top-level crate's SBOM to the expected path.
          if [[ -f bom.json ]]; then
            mv bom.json ../sbom-rust.json
          else
            echo "::error::cargo-cyclonedx did not produce bom.json"
            exit 1
          fi

      - name: Generate npm SBOM
        if: matrix.label == 'Windows'
        # Was `@cyclonedx/cyclonedx-npm` under `continue-on-error: true`. That
        # tool shells out to `npm ls --json --long --all`, which CANNOT read a
        # pnpm-installed tree: pnpm does not materialise transitive dev deps, so
        # npm ls exits ELSPROBLEMS ("missing: <dep>, required by <pkg>") and the
        # generator dies. Verified reproducible on a two-line pnpm project, with
        # and without `--omit dev`. This repo has only pnpm-lock.yaml and no
        # package-lock.json, so the step has never once succeeded - every
        # release to date shipped with NO npm SBOM, silently, because
        # continue-on-error made the failure invisible.
        #
        # cdxgen reads pnpm-lock.yaml natively. Verified locally against this
        # repo: exit 0, valid CycloneDX 1.6, 721 components.
        #
        # FETCH_LICENSE=false keeps generation offline and deterministic
        # (no per-package registry lookups to fail or hang mid-release).
        env:
          FETCH_LICENSE: 'false'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cdxgen@11 -t pnpm -o sbom-npm.json --no-recurse .

          # An empty or component-less SBOM is not an SBOM. Fail rather than
          # publish a file that merely looks like a dependency inventory.
          test -s sbom-npm.json
          COMPONENTS=$(node -e "process.stdout.write(String((require('./sbom-npm.json').components || []).length))")
          echo "npm SBOM components: $COMPONENTS"
          if [ "$COMPONENTS" -lt 1 ]; then
            echo "::error::npm SBOM contains no components - refusing to publish an empty inventory"
            exit 1
          fi

      - name: Upload SBOMs
        if: matrix.label == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Was `... --clobber 2>/dev/null || true`, which hid both the error
          # text and the failure. A generated-but-unpublished SBOM is the same
          # as no SBOM, so an upload failure must fail the release.
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" sbom-rust.json sbom-npm.json --clobber

      - name: Install Cosign
        if: matrix.label == 'Windows'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOMs with Sigstore
        if: matrix.label == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # All three commands were `2>/dev/null || true`, so this step could
          # not fail and its errors were discarded. It also could not ever
          # SUCCEED: keyless `cosign sign-blob` mints a short-lived certificate
          # from a GitHub OIDC token, and this job did not request
          # `id-token: write` - so every release published SBOMs with no
          # signature at all, green. The permission is now granted above and
          # the failures are surfaced.
          set -euo pipefail
          cosign sign-blob --yes --bundle sbom-rust.sig.bundle sbom-rust.json
          cosign sign-blob --yes --bundle sbom-npm.sig.bundle sbom-npm.json
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" sbom-rust.sig.bundle sbom-npm.sig.bundle --clobber

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    # Pure gh-CLI asset shuffling; minutes, not hours.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Consolidate SHA-256 checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p shasums && cd shasums

          # Download every per-platform SHASUMS256-*.txt produced by the matrix.
          for ASSET in $(gh release view "$TAG" --repo "$GH_REPO" --json assets -q '.assets[].name' | grep '^SHASUMS256-'); do
            gh release download "$TAG" --repo "$GH_REPO" -p "$ASSET" --clobber
          done

          # Produce a single SHASUMS256.txt sorted by filename.
          if ls SHASUMS256-*.txt >/dev/null 2>&1; then
            cat SHASUMS256-*.txt | sort -k2 > SHASUMS256.txt
            echo "Consolidated checksums:"
            cat SHASUMS256.txt
            gh release upload "$TAG" SHASUMS256.txt --repo "$GH_REPO" --clobber
          else
            echo "::warning::No per-platform SHASUMS256 files found - consolidated file not created."
          fi

      - name: Verify release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"

          ASSETS=$(gh release view "$TAG" --repo "$GH_REPO" --json assets -q '.assets[].name')
          echo "Release assets:"
          echo "$ASSETS" | sed 's/^/  - /'

          # Required artifacts - fail the release if any are missing.
          REQUIRED=(
            "SHASUMS256.txt"
            "latest.json"
          )

          MISSING=()
          for NAME in "${REQUIRED[@]}"; do
            if ! echo "$ASSETS" | grep -qx "$NAME"; then
              MISSING+=("$NAME")
            fi
          done

          # Desirable-but-not-fatal platform coverage checks.
          for PATTERN in "\\.exe$" "\\.dmg$" "\\.AppImage$"; do
            if ! echo "$ASSETS" | grep -qE "$PATTERN"; then
              echo "::warning::No asset matches $PATTERN - platform coverage incomplete."
            fi
          done

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Release is missing required artifacts:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "All required artifacts present."
      - name: Publish desktop updater manifest
        if: needs.create-release.outputs.production == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          POINTER_TAG="desktop-latest"
          WORK_DIR="desktop-updater-manifest"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          gh release download "$TAG" --repo "$GH_REPO" -p latest.json -D "$WORK_DIR" --clobber
          test -s "$WORK_DIR/latest.json"

          NOTES="Auto-generated pointer release for the desktop app updater. Do not attach MCP server assets here; this release exists only to serve latest.json to installed desktop clients."
          if gh release view "$POINTER_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$POINTER_TAG" --repo "$GH_REPO" \
              --title "4DA Desktop Latest Manifest" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$POINTER_TAG" --repo "$GH_REPO" \
              --title "4DA Desktop Latest Manifest" \
              --notes "$NOTES" \
              --prerelease
          fi

          gh release upload "$POINTER_TAG" "$WORK_DIR/latest.json" --repo "$GH_REPO" --clobber

      # Only a production tag un-drafts. A dry run leaves the draft in place so
      # the artifacts can be inspected and the draft deleted without ever having
      # been visible to a user.
      - name: Publish release
        if: needs.create-release.outputs.production == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })

  publish-mcp:
    name: Publish MCP Server to npm
    needs: create-release
    # npm publishes are IRREVERSIBLE. This job had no tag classification at
    # all, so a `v0.0.N-test` desktop dry run would attempt to publish the MCP
    # server. It is a no-op today only because the version in the manifest is
    # already on npm — bump that version, run a desktop dry run, and it ships.
    # The MCP server has its own `mcp-v*` tag and workflow; a desktop tag
    # should never be what releases it.
    if: needs.create-release.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.15.0 # match packageManager; unpinned drifts to pnpm 10 (needs Node >=22.13) and breaks the Node-20 job

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build MCP server
        working-directory: mcp-4da-server
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Publish to npm
        working-directory: mcp-4da-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # Was `npm publish ... || echo "Publish skipped (version may already
            # exist)"`, which reported EVERY failure - expired token, 2FA
            # challenge, provenance/OIDC rejection, network fault, broken
            # tarball - as a benign version collision, and exited 0. Only a
            # genuine "already published" is benign; everything else must fail.
            set -o pipefail
            if OUTPUT=$(npm publish --access public --provenance 2>&1); then
              echo "$OUTPUT"
              echo "Published successfully."
            else
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -qiE 'EPUBLISHCONFLICT|cannot publish over|previously published version'; then
                echo "::notice::This version is already on npm - nothing to publish."
              else
                echo "::error::npm publish failed for a reason other than an existing version."
                exit 1
              fi
            fi
          else
            echo "NPM_TOKEN secret not set - skipping npm publish."
            echo "To enable: add NPM_TOKEN to repo secrets (npm token create --type granular)"
          fi
