# Dependabot configuration for 4DA.
#
# Keeps supply-chain dependencies current by opening weekly PRs for every
# ecosystem that has a lockfile in the repo. Capped at 5 open PRs per
# ecosystem so the queue stays reviewable and upgrades land in small,
# atomic changes rather than mega-merges.
#
# Ecosystems enabled (each requires a lockfile to exist — Dependabot skips
# directories where it can't find one):
#   - github-actions (/)                — workflow action pins
#   - cargo          (/src-tauri)       — Rust crates (Cargo.lock)
#   - cargo          (/relay)           — Team Relay server (Cargo.lock)
#   - npm            (/)                — root frontend (pnpm-lock.yaml)
#   - npm            (/mcp-4da-server)  — MCP server (pnpm-lock.yaml)
#   - npm            (/mcp-memory-server) — MCP memory server (package-lock.json)
#   - npm            (/editors/vscode/4da) — VS Code extension (package-lock.json)
#
# Dependabot's "npm" ecosystem handles both npm and pnpm lockfiles despite
# the name — the detection is lockfile-based.
#
# Labels route PRs to the right triage lane. Reviewers/assignees default
# to the sole maintainer until the team expands (see CODEOWNERS).
#
# Grouping: every block batches its minor + patch bumps into ONE weekly PR
# (`minor-and-patch`); majors still arrive one PR each, because a major is a
# decision, not a chore. Before this, 36 Dependabot PRs sat open (the oldest
# from 2026-07-13), 18 of them green and mergeable yet never merged — one PR per
# package per week outran a single maintainer, and each PR also pays a full
# merge-queue run. Security updates are not grouped (groups default to
# version updates), so an advisory fix still lands as its own small PR.
#
# Adding a new workspace: drop it in with its own `- package-ecosystem:`
# block. Do NOT omit a maintainer-owned package.json just to keep the
# queue short — that defeats the purpose of the gate.

version: 2
updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"

  # ── Rust (Tauri backend) ──────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(cargo)"
      include: "scope"

  # ── Rust (Team Relay server) ──────────────────────────────────────
  # Separate crate, separate Cargo.lock — NOT a workspace member of
  # /src-tauri, so the block above never sees it. It terminates TLS and
  # serves the encrypted metadata sync API, which makes its transitive
  # rustls / webpki surface security-relevant in a way the desktop app's
  # is not. Left unwatched until 2026-08-14, by which point it had
  # accumulated four rustls-webpki certificate-validation advisories.
  - package-ecosystem: "cargo"
    directory: "/relay"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "rust"
      - "relay"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(relay)"
      include: "scope"

  # ── Frontend (root pnpm workspace) ────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "frontend"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(npm)"
      include: "scope"

  # ── MCP 4DA server ────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/mcp-4da-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "mcp"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(mcp-4da)"
      include: "scope"
    ignore:
      # DEFERRED 2026-09-24 (#446). better-sqlite3 13 declares engines
      # node >=22, dropping Node 20. `@4da/mcp-server` is PUBLISHED to npm with
      # engines node >=20.0.0, so adopting it breaks every Node 20 user of a
      # released package: a semver-major decision for the product, not a
      # routine bump. It also has no Windows prebuild for the Node 22 ABI CI
      # uses, so install falls back to node-gyp and fails without Visual Studio
      # (MCP Server + Fresh clone windows red on #446). Lift this when the
      # package's own engines floor moves to 22.
      - dependency-name: "better-sqlite3"
        versions: [">=13"]

  # ── MCP memory server ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/mcp-memory-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "mcp"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(mcp-memory)"
      include: "scope"
    ignore:
      # DEFERRED 2026-09-24 (#442), same reason as mcp-4da-server above. This
      # package is not built by any CI job (only audited), so #442's green
      # checks never installed it. On the operator's Windows / Node 22 machine
      # a v13 install needs node-gyp + Visual Studio, which would break the dev
      # memory server. Lift together with the mcp-4da-server entry.
      - dependency-name: "better-sqlite3"
        versions: [">=13"]

  # ── VS Code extension ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/editors/vscode/4da"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "vscode"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(vscode)"
      include: "scope"
