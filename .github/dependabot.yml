# Dependabot configuration for 4DA.
#
# Keeps supply-chain dependencies current by opening weekly PRs for every
# ecosystem that has a lockfile in the repo. Capped at 5 open PRs per
# ecosystem so the queue stays reviewable and upgrades land in small,
# atomic changes rather than mega-merges.
#
# Ecosystems enabled (each requires a lockfile to exist — Dependabot skips
# directories where it can't find one):
#   - github-actions (/)                — workflow action pins
#   - cargo          (/src-tauri)       — Rust crates (Cargo.lock)
#   - cargo          (/relay)           — Team Relay server (Cargo.lock)
#   - cargo          (/crates/fourda-depengine) — pure engine crate (Cargo.lock)
#   - npm            (/)                — root frontend (pnpm-lock.yaml)
#   - npm            (/mcp-memory-server) — MCP memory server (package-lock.json)
#   - npm            (/editors/vscode/4da) — VS Code extension (package-lock.json)
#   - npm            (/site)            — 4da.ai site + Pages Functions (pnpm-lock.yaml)
#
# Dependabot's "npm" ecosystem handles both npm and pnpm lockfiles despite
# the name — the detection is lockfile-based.
#
# Labels route PRs to the right triage lane. Reviewers/assignees default
# to the sole maintainer until the team expands (see CODEOWNERS).
#
# Grouping: every block batches its minor + patch bumps into ONE weekly PR
# (`minor-and-patch`); majors still arrive one PR each, because a major is a
# decision, not a chore. Before this, 36 Dependabot PRs sat open (the oldest
# from 2026-07-13), 18 of them green and mergeable yet never merged — one PR per
# package per week outran a single maintainer, and each PR also pays a full
# merge-queue run. Security updates are not grouped (groups default to
# version updates), so an advisory fix still lands as its own small PR.
#
# Cooldown: every block holds a new version for 3 days (7 for a major)
# before proposing it. Malicious releases have historically been pulled within
# hours. Security updates are never held (Dependabot applies cooldown to
# version updates only). The pnpm projects enforce the same 3-day minimum
# themselves (minimumReleaseAge in each pnpm-workspace.yaml).
#
# Adding a new workspace: drop it in with its own `- package-ecosystem:`
# block. Do NOT omit a maintainer-owned package.json just to keep the
# queue short — that defeats the purpose of the gate.

version: 2
updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # semver-*-days are not supported for github-actions (Dependabot rejects
    # the whole file: "semver-major-days is not supported for the package
    # ecosystem 'github-actions'"), so actions get the flat cooldown only.
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"

  # ── Rust (Tauri backend) ──────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
      # Our own crates release in lockstep with 4DA; no hold for them.
      exclude: ["victauri-*"]
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(cargo)"
      include: "scope"

  # ── Rust (Team Relay server) ──────────────────────────────────────
  # Separate crate, separate Cargo.lock — NOT a workspace member of
  # /src-tauri, so the block above never sees it. It terminates TLS and
  # serves the encrypted metadata sync API, which makes its transitive
  # rustls / webpki surface security-relevant in a way the desktop app's
  # is not. Left unwatched until 2026-08-14, by which point it had
  # accumulated four rustls-webpki certificate-validation advisories.
  - package-ecosystem: "cargo"
    directory: "/relay"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
      - "rust"
      - "relay"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(relay)"
      include: "scope"

  # ── Rust (pure dependency engine) ─────────────────────────────────
  # crates/fourda-depengine has its own Cargo.lock for its standalone CI
  # build and the wasm module (inside the app it resolves through
  # /src-tauri's lockfile). Four direct deps (serde, serde_json, semver,
  # regex), 16 packages shared with /src-tauri. This block and the
  # /src-tauri one open SEPARATE PRs. The depengine CI job
  # (scripts/check-lock-drift.cjs) lets either merge alone in the right
  # order: a /src-tauri PR that moves a shared package to a new major.minor
  # merges with a ::warning; a PR here that moves the crate PAST the app
  # fails until the /src-tauri bump has landed, after which Dependabot's
  # rebase of it passes. Patch-level differences are only noted.
  - package-ecosystem: "cargo"
    directory: "/crates/fourda-depengine"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(depengine)"
      include: "scope"

  # ── Frontend (root pnpm workspace) ────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
      - "frontend"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(npm)"
      include: "scope"
    ignore:
      # DEFERRED 2026-10-05 (#773), same reason as the mcp-memory-server block
      # below (#442). better-sqlite3 13 dropped prebuild-install: every install
      # compiles with node-gyp, and node-gyp 10.2 cannot find the hosted
      # windows runner's Visual Studio 18 ("unknown version"), so the Frontend
      # job fails at `pnpm install`. Root scripts (check-deploy-truth,
      # judge-cohort-monitor, dogfood-check, source-pipeline-health) need it.
      # Lift once 13.x ships prebuilds again or node-gyp supports VS 18.
      - dependency-name: "better-sqlite3"
        versions: [">=13"]

  # ── MCP memory server ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/mcp-memory-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
      - "mcp"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(mcp-memory)"
      include: "scope"
    ignore:
      # DEFERRED 2026-09-24 (#442). better-sqlite3 13 ships no Windows
      # prebuild for the Node 22 ABI. This package is not built by any CI job
      # (only audited), so #442's green checks never installed it. On the
      # operator's Windows / Node 22 machine a v13 install needs node-gyp +
      # Visual Studio, which would break the dev memory server. Lift together
      # with the same deferral in 4DA-Systems/4da-mcp-server's dependabot.yml.
      - dependency-name: "better-sqlite3"
        versions: [">=13"]

  # ── VS Code extension ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/editors/vscode/4da"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # @types/vscode must match engines.vscode (the oldest VS Code the
    # extension supports): vsce refuses to package when the types are newer,
    # and newer types let code use APIs older editors lack. #838 bumped it to
    # 1.140 and packaging failed from then on. Raise both together, by hand.
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
      - "vscode"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(vscode)"
      include: "scope"

  # ── 4da.ai site (11ty + Cloudflare Pages Functions) ───────────────
  # Its own pnpm project and lockfile. The Functions (licence activation and
  # refresh, Stripe checkout) are production code, so the site gets version
  # updates like every other project, not only security alerts.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
    assignees:
      - "runyourempire"
    reviewers:
      - "runyourempire"
    commit-message:
      prefix: "chore(site)"
      include: "scope"
