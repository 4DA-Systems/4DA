[package]
name = "fourda"
version = "1.0.1"
description = "4DA - All signal. No feed."
authors = ["4DA Systems Pty Ltd"]
license = "FSL-1.1-Apache-2.0"
edition = "2021"
rust-version = "1.95"
default-run = "fourda"
publish = false

[lib]
name = "fourda_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# The deep-link feature forwards a second instance's argv (the fourda:// URL
# Windows hands to a NEW process when the app is already running) into the
# deep-link plugin's `deep-link://new-url` event. Without it, deep links only
# worked when the app was closed.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }

# Async runtime (specific features instead of "full" to reduce binary ~500KB)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "signal", "process"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls", "charset", "http2", "macos-system-configuration"] }

# Signal Terminal HTTP server
axum = { version = "0.8", features = ["tokio"] }
tower-http = { version = "0.6", features = ["cors"] }

# URL encoding / parsing
urlencoding = "2"
url = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# File watching
notify = "8"

# HTML parsing (for HN content scraping)
scraper = "0.27"

# Embeddings (local MiniLM model)
# In-process embedding via ONNX Runtime — zero network, zero config, privacy preserved.
# ort-load-dynamic: loads onnxruntime shared lib at runtime (avoids MSVC 2022 static link requirement).
fastembed = { version = "5", optional = true, default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

# Thread-safe state
once_cell = "1"
parking_lot = "0.12"

# Database (sqlite + vector search)
# Default: "bundled" (plaintext SQLite). For encrypted databases:
#   1. Install Strawberry Perl: choco install strawberryperl
#   2. Change to: features = ["bundled-sqlcipher-vendored-openssl"]
# The encryption key management (db/encryption.rs) is already wired and will
# activate automatically when SQLCipher is enabled. sqlite-vec is compatible.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"

# Hashing for deduplication
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
getrandom = "0.4"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Directory utilities (for home dir resolution)
dirs = "5"

# Async trait support
async-trait = "0.1"

# Email delivery (digest emails via user's SMTP)
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }

# Base64 encoding/decoding (for GitHub README)
base64 = "0.22"

# Phase 1: Multi-format document extraction (basic support)
# Note: Using pure Rust alternatives instead of C library bindings
pdf-extract = "0.12"         # PDF text extraction (0.12 uses lopdf ^0.42; RUSTSEC-2026-0187)
lopdf = "0.42"               # PDF manipulation (RUSTSEC-2026-0187: stack overflow fixed in 0.42)
docx-rs = "0.4.22"           # Word document parsing (>=0.4.21 for quick-xml 0.41: RUSTSEC-2026-0194/0195)
calamine = "0.36"            # Excel spreadsheet parsing (>=0.36 for quick-xml 0.41: RUSTSEC-2026-0194/0195)
image = "0.25"                                    # Image analysis (OCR + file extraction)
ocrs = { version = "0.12", optional = true }     # Pure Rust OCR engine
rten = { version = "0.24", optional = true }     # Model loading for ocrs (text-detection.rten, text-recognition.rten)
# whisper-rs = "0.14"       # DISABLED: Requires vcpkg/system deps - audio.rs stubbed
zip = "8.6"                                        # ZIP archive extraction (OSV cache + extractors)
tar = { version = "0.4.45", optional = true }        # TAR archive extraction
flate2 = { version = "1.0", optional = true }     # Gzip compression/decompression

# Language detection (fast, zero-dependency)
whichlang = "0.1"

# Semantic version parsing (CVE version range matching)
semver = "1"

# System startup (launch at login)
tauri-plugin-autostart = "2"

# System hardware detection (RAM, CPU) for model recommendations
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# AI agent introspection & control (MCP server).
# Caret-compatible (not "=") so patch/minor Victauri releases flow in via
# `cargo update` without a manual Cargo.toml edit.
# NOT a debug-only dependency: it sits in [dependencies], under no
# cfg(debug_assertions) target table, and `lib.rs` registers VictauriBuilder
# unconditionally (unlike tauri_plugin_updater a few lines above it, which IS
# cfg-gated). It is therefore compiled into and registered by release builds.
# Whatever inertness release builds get comes from the crate's own internal
# gating, not from anything in this manifest — so treat a Victauri advisory as
# affecting the shipped binary until proven otherwise.
# 2026-06-14: bumped 0.7 -> 0.8 (0.8.0 "command catalog, cross-engine, robustness"
# release crosses the caret-0.7 ceiling, so the minor bump needs this manual edit).
victauri-plugin = "0.8"

# Compile-time scoring macros
fourda-macros = { path = "fourda-macros" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
tauri-plugin-deep-link = "2.4.7"

# SSO cryptographic verification (enterprise feature)
jsonwebtoken = { version = "10", features = ["rust_crypto"], optional = true }
# SECURITY: RUSTSEC-2023-0071 (Marvin Attack timing sidechannel) addressed in 0.10.0-pre.
# Only compiled when enterprise feature is enabled (SSO crypto). Monitor: https://rustsec.org/advisories/RUSTSEC-2023-0071
rsa = { version = "0.10.0-pre", features = ["sha2"], optional = true }
pkcs8 = { version = "0.11", features = ["pem"], optional = true }
x509-cert = { version = "0.3.0-pre", optional = true }

# Team sync — E2E encrypted metadata relay (AD-023)
chacha20poly1305 = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
zeroize = "1"

# Keyring — cross-platform credential storage (Windows Credential Manager, macOS Keychain, Linux Secret Service)
keyring = { version = "3", features = ["sync-secret-service", "linux-native", "apple-native", "windows-native"] }
ammonia = "4"

# Platform-specific dependencies
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_SystemInformation"] }
winreg = "0.55"
tauri-winrt-notification = "0.7"

[[bin]]
name = "4da"
path = "src/bin/cli.rs"

# OCR test utilities live in examples/ to prevent Tauri from bundling them
# Run with: cargo run --example test_ocr_full --features ocr
[[example]]
name = "test_ocr_full"
path = "examples/test_ocr_full.rs"
required-features = ["ocr"]

[[example]]
name = "test_ocr"
path = "examples/test_ocr.rs"
required-features = ["ocr"]

[[example]]
name = "test_ocr_text"
path = "examples/test_ocr_text.rs"
required-features = ["ocr"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
victauri-test = "0.8"

[[bench]]
name = "db_scale"
harness = false

[features]
default = ["fastembed-local"]
fastembed-local = ["dep:fastembed", "dep:tar", "dep:flate2"]
ocr = ["dep:ocrs", "dep:rten"]
archive = ["dep:tar", "dep:flate2"]
void-universe = []
sql-check = []
experimental = []
# Recall investigation (test infrastructure only — ships NOTHING to production).
# calibrated-sim swaps the scoring simulation's SYNTHETIC corpus/interest
# embeddings for REAL fastembed (snowflake-arctic-embed-m) fixtures committed
# under src/scoring/simulation/fixtures/*.bin, so reality.rs / quality_dashboard
# measure TRUE per-persona recall instead of the structurally-inflated synthetic
# deficit. OFF by default: the default `cargo test` stays on the synthetic
# baseline (golden_snapshot 50 expectations + reality.rs) byte-for-byte.
calibrated-sim = []
# generate-sim-fixtures unlocks the ignored fixture-generator test that embeds
# the corpus + persona topics via fastembed and writes the *.bin fixtures.
# Requires the fastembed model; run once to (re)produce the committed fixtures.
generate-sim-fixtures = ["fastembed-local"]
# Feature-gated command groups (ghost commands with zero frontend callers)
team-sync = []       # Team Sync, Intelligence, Monitoring (AD-023) — 17 commands
enterprise = ["dep:jsonwebtoken", "dep:rsa", "dep:pkcs8", "dep:x509-cert"]      # Audit, Webhooks, Organizations, Analytics, SSO crypto — 15 commands
streets-execution = [] # STREETS command execution (not content) — 3 commands

[[test]]
name = "sql_checker"
required-features = ["sql-check"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Deny dangerous patterns
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
# NOTE on `clippy::string_slice`: byte-slicing a str panics on any index that is
# not a UTF-8 char boundary, and 23 such vectors accumulated on ingested text
# before #422 fixed them — while `unwrap_used = "deny"` above kept production
# unwraps at exactly zero. That asymmetry is real and this lint is the right
# closer. It is NOT enabled crate-wide yet.
#
# MEASURED (`cargo clippy --lib -- -W clippy::string_slice`, 2026-08-17): it
# fires **193** times, down from 246 measured on the same command before this
# branch. The "280" previously stated here was never re-measured; the number
# moves every time a module is hardened, so RE-MEASURE before quoting it.
# Current shape: ace/scanner.rs 30, monitoring_briefing.rs 13, sources/rss.rs 9,
# sources/arxiv.rs 9, scoring/pipeline_v2.rs 8, sources/mastodon.rs 7,
# diagnostics.rs 7, sources/youtube.rs 6, ...
#
# Blanket-allowing that backlog would cement any live panic hiding in it, so it
# is adopted module-by-module via a `#![deny(clippy::string_slice)]` at the
# module root. A module qualifies when it has zero hits OR every remaining
# slice carries an `#[allow]` stating its char-boundary proof — a
# `floor_char_boundary`, a `find`/`rfind` offset of an ASCII needle (optionally
# plus that needle's ASCII length), a `char_indices`/`match_indices` offset, or
# an explicit `snap_to_char_boundary`. "It looks fine" is not a proof.
#
# Closed (18 modules):
#   source_fetching/{mod,fetcher}.rs, utils/{text,word_boundary}.rs, signals.rs,
#   package_ambiguity.rs, knowledge_decay.rs, competing_tech.rs, dep_linker.rs,
#   preemption.rs, scoring/dependencies.rs, stacks/scoring.rs, llm_judge.rs,
#   llm_stream.rs, ipc_guard.rs, taste_test_commands.rs, health_checks.rs,
#   ace/watcher.rs
#
# Note the denies reach `#[cfg(test)]` code too, which is deliberate: a test
# that byte-slices is a test that can panic on its own fixture.
# Promote to a crate-wide deny here once the backlog is audited out.
# Pedantic — good code practices
pedantic = { level = "warn", priority = -1 }
# Allow specific pedantic lints that are too noisy for this codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# These are valid patterns in our codebase
wildcard_imports = "allow"
enum_glob_use = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
