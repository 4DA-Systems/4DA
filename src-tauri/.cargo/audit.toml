# Cargo audit advisory ignore list
# Only add entries with clear justification — every ignore weakens the audit.

[advisories]
ignore = [
    # atk@0.18.2 (RUSTSEC-2024-0413) — GTK3 bindings unmaintained, Linux only.
    # Will be resolved when Tauri migrates to GTK4. Not exploitable.
    "RUSTSEC-2024-0413",

    # rsa@0.9.x (RUSTSEC-2023-0071) — Marvin Attack timing sidechannel, no fix upstream.
    # Only compiled under `enterprise` feature for JWT RS256 verification (not decryption).
    # Full risk assessment in deny.toml. Monitoring: https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",

    # quick-xml <0.41 (RUSTSEC-2026-0194 / RUSTSEC-2026-0195) was ignored here
    # until 2026-08-14. RESOLVED, not suppressed: calamine 0.36, docx-rs 0.4.21
    # and plist 1.10 all shipped against quick-xml ^0.41, so the three vulnerable
    # copies (0.31.0 / 0.36.2 / 0.39.4) collapsed to a single quick-xml 0.41.0.
    # Do not re-add these ignores — pin the consumers forward instead.

    # -----------------------------------------------------------------------
    # gtk-rs GTK3 bindings — unmaintained (RUSTSEC-2024-0411..0420) + glib
    # unsound (RUSTSEC-2024-0429). Linux-ONLY: this whole family is pulled in
    # transitively by the Tauri v2 Linux webview stack (webkit2gtk -> gtk).
    # They compile to nothing on Windows/macOS. The gtk-rs project deprecated
    # the GTK3 bindings; the fix is Tauri's migration to GTK4, tracked upstream.
    # 4DA calls none of these directly (glib::VariantStrIter in particular is
    # never used). Extends the existing atk (RUSTSEC-2024-0413) ignore.
    # REVISIT: drop when Tauri's Linux backend moves to GTK4 / webkit6.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib unsound (VariantStrIter) — not used by 4DA

    # -----------------------------------------------------------------------
    # unic-* Unicode crates — unmaintained (RUSTSEC-2025-0075/0080/0081/0098/0100).
    # BUILD-TIME transitive only: unic-ucd-* <- urlpattern <- tauri-utils <-
    # tauri-build (a [build-dependencies] chain). Not linked into the shipped
    # binary's runtime. Pure Unicode table lookups; no known vulnerability, only
    # a maintenance-status flag. No maintained drop-in exists yet.
    # REVISIT: drop when tauri-utils/urlpattern move off the unic-* crates.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0098", # unic-ucd-version

    # -----------------------------------------------------------------------
    # proc-macro build-time unmaintained: paste (RUSTSEC-2024-0436),
    # proc-macro-error (RUSTSEC-2024-0370), proc-macro-error2 (RUSTSEC-2026-0173).
    # Compile-time only (proc-macro expansion) — zero runtime/attack surface in
    # the shipped app. Deep transitive deps of gtk3-macros / dependency macros.
    # REVISIT: drop as consumers migrate to maintained macro crates.
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0173", # proc-macro-error2

    # -----------------------------------------------------------------------
    # ttf-parser unmaintained (RUSTSEC-2026-0192). Transitive font parser; the
    # only surface is local font/glyph handling in the rendering/OCR path — no
    # network input. No known vulnerability, maintenance-status flag only.
    # REVISIT: drop when the upstream consumer moves to a maintained parser.
    "RUSTSEC-2026-0192", # ttf-parser
]
