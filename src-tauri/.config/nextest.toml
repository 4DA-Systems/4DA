# cargo-nextest configuration. CI runs `cargo nextest run --profile ci` in the
# Validate Rust matrix (.github/workflows/validate.yml). Local `cargo test`
# is unaffected; `cargo nextest run` locally uses the default profile.

[profile.ci]
# Report every failure in one run, not just the first.
fail-fast = false
# One retry. A test that fails and then passes is reported FLAKY, and the
# workflow raises a warning naming it, so it stays visible rather than going
# silently green. A real regression fails both attempts and fails the job.
# Before this, one timing flake (the watcher panic test, #737) ejected a
# merge-queue entry and rebuilt everything behind it (~30 min).
retries = 1
# Flag anything over 60s, and kill a test still running after 5 periods
# (5 min). The whole suite runs in ~90s, so a test at 5 min is hung, not slow.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
# Per-test timings and flaky markers, parsed by the workflow step.
path = "junit.xml"
