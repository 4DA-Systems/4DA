# pnpm settings for @4da/mcp-server. A standalone project: `packages` is empty
# on purpose. Its install-script allowlist (better-sqlite3, esbuild) is in
# package.json `pnpm.onlyBuiltDependencies`.
packages: []

# --- Supply-chain policy (same values as the root pnpm-workspace.yaml) ------
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []
trustPolicy: no-downgrade
# Exceptions: "package@version" with the reason in a comment.
trustPolicyExclude: []
strictDepBuilds: true
