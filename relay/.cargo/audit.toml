# Cargo audit advisory ignore list — 4DA Team Relay.
# Only add entries with clear justification — every ignore weakens the audit.
# Every entry carries `REVISIT BY <date>` on its line; scripts/check-remove-by.cjs
# fails an undated entry and one whose date has passed.
#
# Run from this directory:  cargo audit
# CI: .github/workflows/nightly-audit.yml audits src-tauri/ and relay/.

[advisories]
ignore = [
    # rsa@0.9.10 (RUSTSEC-2023-0071) — Marvin Attack timing sidechannel.
    # No fixed upstream version exists.
    #
    # NOT COMPILED INTO THE RELAY. `rsa` reaches this lockfile only through
    # `sqlx-mysql`, which is an OPTIONAL sqlx backend. relay enables
    # `features = ["sqlite", "runtime-tokio-rustls"]` and never `mysql`, so
    # sqlx-mysql is absent from the build graph — verified with
    # `cargo tree -i rsa` and `cargo tree -i sqlx-mysql`, both of which report
    # "nothing to print". A Cargo.lock records the full resolve including
    # optional backends, which is why `cargo audit -f Cargo.lock` still sees it.
    #
    # REVISIT: drop this ignore if sqlx ever stops vendoring the mysql backend
    # into the resolve, or if rsa ships a constant-time fix.
    "RUSTSEC-2023-0071", # REVISIT BY 2027-02-12

    # crypto-bigint 0.5.5 (RUSTSEC-2026-0387) timing variability; fixed only
    # in >=0.7.6. It reaches the relay through jsonwebtoken 11.1 (newest) ->
    # p256/p384 0.13, compiled because the rust_crypto backend builds every
    # curve. The relay signs and verifies HS256 only (Header::default,
    # Validation::default, from_secret in src/auth.rs), so no elliptic-curve
    # operation ever runs. Checked 2026-10-25.
    # REVISIT: drop when jsonwebtoken moves to p256/p384 0.14 (crypto-bigint 0.7).
    "RUSTSEC-2026-0387", # REVISIT BY 2027-02-12

    # libsqlite3-sys 0.30.1 (RUSTSEC-2026-0459, CVE-2026-119375): bundled SQLite
    # before 3.54.0 can return uninitialised page-cache memory when a process
    # opens a database together with a crafted sibling -wal file whose page size
    # differs. Fixed only in libsqlite3-sys >=0.39, and no sqlx release accepts
    # it: sqlx-sqlite 0.8.6 needs ^0.30.1 and 0.9.0 (newest) needs <0.38.0.
    # Checked 2026-11-10. The relay opens exactly one database, its own
    # (DATABASE_URL, default sqlite:relay.db, in src/main.rs), which it creates
    # and writes itself; an attacker would need write access to the server's
    # data directory to plant the file pair, i.e. the server is already theirs.
    # The desktop app is not covered by this entry: it moved to rusqlite 0.41
    # (libsqlite3-sys 0.39.1, SQLite 3.54.1) instead of ignoring it.
    # REVISIT: drop when sqlx-sqlite allows libsqlite3-sys >=0.39.
    "RUSTSEC-2026-0459", # REVISIT BY 2027-02-12
]
